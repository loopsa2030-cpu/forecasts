<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awon · Monthly Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --teal:#1D4A4F; --teal-deep:#163C40; --teal-mid:#2F6A6E; --teal-soft:#5E8F92;
  --mint:#E4EEEC; --mint-2:#F1F6F5; --bg:#F4F7F6; --card:#FFFFFF;
  --ink:#17302F; --muted:#6A7C7A; --line:#DCE6E4;
  --good:#2E7D5B; --good-bg:#E2F1E9; --bad:#B9472A; --bad-bg:#FBE9E3; --warn:#A87718; --warn-bg:#FBF1DC;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Readex Pro','Segoe UI',Tahoma,system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.n,.stat .v,input[type=number]{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button{font-family:inherit}

/* ---------- top & hero share the brand field ---------- */
.brandfield{background:var(--teal);color:#fff;position:relative;overflow:hidden}
.heroshell{max-width:1320px;margin-inline:auto;position:relative}
.smile{position:absolute;bottom:14px;inset-inline-end:clamp(16px,4vw,44px);width:210px;height:auto;opacity:.16;pointer-events:none}
.top{max-width:1320px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:20px clamp(16px,4vw,44px) 6px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:16px}
.brand img{height:46px;width:auto;display:block}
.brand .sub{font-size:14px;font-weight:300;opacity:.85;padding-inline-start:16px;border-inline-start:1px solid rgba(255,255,255,.3)}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.lang button{border:none;background:transparent;color:#fff;font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer;opacity:.75}
.lang button.on{background:#fff;color:var(--teal);opacity:1}
.month{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;width:150px}
.month::placeholder{color:rgba(255,255,255,.6)}
.btn{border:none;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer;
  transition:transform .15s ease,box-shadow .2s ease,background .2s ease}
.btn:hover{transform:translateY(-1px)}
.btn.light{background:#fff;color:var(--teal);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.btn.primary{background:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-deep)}
.btn.ghost{background:var(--mint);color:var(--teal)}
.btn.ghost:hover{background:#D6E6E3}

.hero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:22px clamp(16px,4vw,44px) 52px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.08);border-radius:var(--r-lg);padding:18px 20px}
.stat .l{font-size:13px;opacity:.8}
.stat{min-width:0}
.stat .v{display:block;font-size:clamp(22px,3.4vw,40px);overflow-wrap:anywhere;font-weight:600;letter-spacing:-.01em;line-height:1.15;margin-top:4px}
.stat .v small{font-size:.42em;font-weight:400;opacity:.7;margin-inline-start:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 11px;border-radius:999px;margin-top:10px}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.soft{background:rgba(255,255,255,.14);color:#fff}

/* ---------- tabs ---------- */
.tabwrap{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px clamp(16px,4vw,44px) 0;max-width:1320px;margin-inline:auto}
.tabs{display:inline-flex;gap:4px;background:var(--card);border-radius:999px;padding:5px;box-shadow:0 1px 3px rgba(23,48,47,.06)}
.tab{border:none;background:transparent;color:var(--muted);font-size:14px;font-weight:500;padding:9px 20px;border-radius:999px;cursor:pointer}
.tab:hover{color:var(--teal)}
.tab.on{background:var(--teal);color:#fff}

main{padding:18px clamp(16px,4vw,44px) 60px;max-width:1320px;margin-inline:auto}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(23,48,47,.05)}
.card h2{font-size:18px;font-weight:600;margin:0 0 4px}
.card .lead{color:var(--muted);font-size:14px;margin:0 0 16px;max-width:70ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;font:inherit;font-size:15px;width:140px;background:#fff;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--teal-mid)}

/* verdict */
.verdict{font-size:20px;font-weight:600;line-height:1.35;margin:0 0 6px;color:var(--teal)}
.scen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.sc{border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px 18px}
.sc.rec{border-color:var(--teal);background:var(--mint-2)}
.sc .t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-weight:600;font-size:14.5px}
.sc .t .pill{margin-top:0;flex:none}
.sc dl{display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin:12px 0 0;font-size:14px}
.sc dt{color:var(--muted)} .sc dd{margin:0;font-weight:600}
.sc dd.good{color:var(--good)} .sc dd.bad{color:var(--bad)}
.sc .note{font-size:12.5px;color:var(--muted);margin-top:10px}

/* bridge */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:minmax(150px,230px) 1fr 96px;gap:14px;align-items:center;font-size:14px}
.track{height:14px;background:var(--mint);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--teal-soft);border-radius:999px;transition:width .45s ease}
.step.last .fill{background:var(--teal)}
.step .n{text-align:end;font-weight:600}
.step .d{font-size:12px;color:var(--good);font-weight:500;display:block}

.watch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.w{border-radius:var(--r-md);padding:14px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.w.bad{background:var(--bad-bg);color:#7A2E1B} .w.warn{background:var(--warn-bg);color:#6E4E10} .w.good{background:var(--good-bg);color:#1E5A40}
.w b{font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;background:currentColor}
.foot{font-size:12.5px;color:var(--muted);margin-top:4px}

/* levers */
.levers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lever{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px;cursor:pointer}
.lever.on{border-color:var(--teal-mid);background:var(--mint-2)}
.sw{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.lever.on .sw{background:var(--teal)}
.lever.on .sw::after{inset-inline-start:19px}
.lever .lt{font-weight:500;font-size:14px}
.lever .ls{font-size:12.5px;color:var(--muted)}

/* segmented */
.seg{display:inline-flex;background:var(--mint);border-radius:999px;padding:4px;gap:2px;margin-bottom:16px}
.seg button{border:none;background:transparent;color:var(--teal);font-size:14px;font-weight:500;padding:8px 18px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--teal);color:#fff}

/* tables */
.tbl{overflow-x:auto;border:1.5px solid var(--line);border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:500;font-size:12.5px;color:var(--muted);text-align:end;padding:11px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:var(--mint-2)}
td{padding:9px 12px;text-align:end;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:start}
td:first-child{font-weight:500}
tr:last-child td{border-bottom:none}
tr.tot td{background:var(--teal);color:#fff;font-weight:600}
td.dim{color:var(--muted)}
td.good{color:var(--good);font-weight:600} td.bad{color:var(--bad);font-weight:600}
td input[type=number]{max-width:130px}
td input,td select{border:1.5px solid transparent;background:var(--mint-2);border-radius:8px;padding:6px 9px;font:inherit;font-size:14px;
  width:100%;min-width:84px;text-align:end;color:var(--ink)}
td select{text-align:start;min-width:170px}
td input.txt{text-align:start;min-width:160px;direction:auto}
td input:focus,td select:focus{outline:none;border-color:var(--teal-mid);background:#fff}
.rm{border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:0 6px;line-height:1}
.rm:hover{color:var(--bad)}
details{margin-top:4px}
details summary{cursor:pointer;font-weight:600;font-size:16px;list-style:none;display:flex;align-items:center;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+";width:26px;height:26px;border-radius:50%;background:var(--mint);color:var(--teal);
  display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex:none}
details[open] summary::before{content:"−"}
details .inner{margin-top:16px}
.info{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--mint);
  color:var(--teal);font-size:11px;font-weight:600;cursor:help;margin-inline-start:6px;vertical-align:1px}

#toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);background:var(--teal-deep);color:#fff;
  padding:12px 20px;border-radius:999px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;z-index:50}
[dir=rtl] #toast{transform:translateX(50%)}

@media (max-width:900px){
  .hero{grid-template-columns:repeat(2,minmax(0,1fr))}
  .scen,.watch{grid-template-columns:1fr}
  .levers,.grid2{grid-template-columns:1fr}
}
@media (max-width:520px){
  .brand .sub{display:none}
  .stat{padding:14px}
  .stat .pill{font-size:11px;padding:3px 8px}
  .hero{gap:10px;padding-bottom:44px}
  .smile{width:150px}
  .step{grid-template-columns:1fr 70px}.step .track{grid-column:1/-1;grid-row:2}
  .tab{padding:8px 13px}
}
</style>
</head>
<body>
<div class="brandfield">
  <header class="top">
    <div class="brand">
      <img id="wordmark" alt="Awon">
      <span class="sub" data-t="brandSub"></span>
    </div>
    <div class="actions">
      <div class="lang"><button data-lang="en">EN</button><button data-lang="ar">ع</button></div>
      <input class="month" id="monthLabel" value="October 2026" aria-label="Month">
      <button class="btn light" id="exportBtn" data-t="download"></button>
    </div>
  </header>
  <div class="heroshell">
  <section class="hero" id="hero"></section>
  <svg class="smile" viewBox="0 0 230 40" aria-hidden="true"><path d="M8 8 Q115 58 222 8" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/></svg>
  </div>
</div>

<div class="tabwrap">
  <nav class="tabs">
    <button class="tab on" data-tab="plan" data-t="tabPlan"></button>
    <button class="tab" data-tab="budget" data-t="tabBudget"></button>
    <button class="tab" data-tab="ret" data-t="tabRet"></button>
    <button class="tab" data-tab="city" data-t="tabCity"></button>
  </nav>
</div>

<main>
  <div class="panel on" id="panel-plan"></div>
  <div class="panel" id="panel-budget"></div>
  <div class="panel" id="panel-ret"></div>
  <div class="panel" id="panel-city"></div>
</main>
<div id="toast"></div>

const div = (a,b) => (b ? a/b : 0);

function effCPND(ch, st){
  let c = ch.cpnd;
  if(ch.id==="snap" && st.levers.snapRefresh) c = Math.min(c, 28);
  if(st.levers.exclude && ch.id!=="partner") c *= 0.85;
  const scale = ch.spend > 0 ? Math.pow(ch.spend / ch.ref, st.elasticity) : 1;
  return c * scale;
}
function channelDonors(ch, st){
  if(ch.kind==="fixed") return ch.donors;
  return ch.spend > 0 ? ch.spend / effCPND(ch, st) : 0;
}

function kgPair(city, st){
  const denom = st.baseNewShare*st.kgRatio + (1-st.baseNewShare);
  const kgRet = city.kgBlend / denom;
  return { kgNew: kgRet*st.kgRatio, kgRet };
}

// Returning donors per city from pools; optional cap = fraction of full returning volume
function returningFor(city, st, pools, capR){
  const p = PRESETS[st.preset];
  const seg = {};
  SEGMENTS.forEach(s=>{
    const pool = pools[s.key] * city.baseShare * st.served;
    const donors = pool * p.rate[s.key] * city.repeatIdx;
    seg[s.key] = { pool, rate:p.rate[s.key], donors, rcac:p.rcac[s.key], spend: donors * p.rcac[s.key] };
  });
  return seg;
}

function computePlan(cities, channels, st, pools, overheadAwon, returnScale){
  const rs = returnScale === undefined ? 1 : returnScale;
  const chRows = channels.map(ch=>{
    const donors = channelDonors(ch, st);
    return { ...ch, donors, cpndEff: ch.kind==="fixed" ? div(ch.spend, ch.donors) : effCPND(ch, st) };
  });
  // lever volumes on top of fixed channels
  const fastDonors = st.levers.fast ? 450 : 0;
  const capiDonors = st.levers.capi ? 300 : 0, capiSpend = st.levers.capi ? 900 : 0;

  const paidRows = chRows.filter(c=>c.kind==="scalable" && c.id!=="partner");
  const paidSpend = paidRows.reduce((a,c)=>a+c.spend,0);
  const paidNew = paidRows.reduce((a,c)=>a+c.donors,0);
  const partner = chRows.find(c=>c.id==="partner");
  const partnerSpend = partner ? partner.spend : 0, partnerNew = partner ? partner.donors : 0;
  const fixedRows = chRows.filter(c=>c.kind==="fixed");
  const otherSpend = fixedRows.reduce((a,c)=>a+c.spend,0) + capiSpend;
  const haloNew = st.halo ? Math.max(-fixedRows.reduce((a,c)=>a+c.donors,0), st.halo * (paidSpend - st.refPaidSpend) / 1000) : 0;
  const otherNew = fixedRows.reduce((a,c)=>a+c.donors,0) + fastDonors + capiDonors + haloNew;

  const totalDrivers = cities.reduce((a,c)=>a+c.drivers,0);
  const rows = cities.map(c=>{
    const { kgNew, kgRet } = kgPair(c, st);
    const seg = returningFor(c, st, pools);
    // optional scaling of returning volume, dropping the costliest segments first
    let segRows = SEGMENTS.map(s=>({ key:s.key, ...seg[s.key] }));
    if(rs < 1){
      const full = segRows.reduce((a,x)=>a+x.donors,0);
      let budget = full * rs;
      segRows = [...segRows].sort((a,b)=>a.rcac-b.rcac).map(x=>{
        const take = Math.max(0, Math.min(x.donors, budget)); budget -= take;
        return { ...x, donors: take, spend: take * x.rcac };
      });
    }
    const retDonors = segRows.reduce((a,x)=>a+x.donors,0);
    const waSpend = segRows.reduce((a,x)=>a+x.spend,0);
    const cPaidSpend = paidSpend * c.paidShare, cPaidNew = paidNew * c.paidShare;
    const cPartnerSpend = partnerSpend * c.baseShare, cPartnerNew = partnerNew * c.baseShare;
    const cOtherSpend = otherSpend * c.baseShare, cOtherNew = otherNew * c.baseShare;
    const newDonors = cPaidNew + cPartnerNew + cOtherNew;
    const newSpend = cPaidSpend + cPartnerSpend + cOtherSpend;
    const pickups = newDonors + retDonors;
    const kgNewTot = newDonors * kgNew, kgRetTot = retDonors * kgRet;
    const weight = kgNewTot + kgRetTot;
    const ohShare = overheadAwon * div(c.drivers, totalDrivers);
    const direct = newSpend + waSpend;
    const spend = direct + ohShare;
    return { ...c, kgNew, kgRet, segRows, retDonors, waSpend,
      paidSpend:cPaidSpend, paidNew:cPaidNew, partnerSpend:cPartnerSpend, partnerNew:cPartnerNew,
      otherSpend:cOtherSpend, otherNew:cOtherNew, newDonors, newSpend,
      pickups, kgNewTot, kgRetTot, weight, direct, ohShare, spend,
      newShare: div(newDonors, pickups), nCAC: div(newSpend, newDonors), rCAC: div(waSpend, retDonors),
      cpk: div(spend, weight), dailyWeight: div(weight, c.days),
      ppd: div(div(pickups, c.days), c.drivers),
      driversNeeded: Math.max(Math.ceil(div(pickups, c.days * st.maxPPD) - 1e-9), Math.ceil(div(weight, c.days * c.carCap) - 1e-9)),
      carUse: div(div(div(weight, c.days), c.drivers), c.carCap),
      leads: div(pickups, c.pr) };
  });
  const s = k => rows.reduce((a,r)=>a+(r[k]||0),0);
  const T = { rows, chRows, fastDonors, capiDonors, capiSpend, haloNew,
    paidSpend, paidNew, partnerSpend, partnerNew, otherSpend, otherNew,
    newDonors:s("newDonors"), retDonors:s("retDonors"), pickups:s("pickups"),
    newSpend:s("newSpend"), waSpend:s("waSpend"), direct:s("direct"), overhead:overheadAwon,
    spend:s("spend"), weight:s("weight"), kgNewTot:s("kgNewTot"), kgRetTot:s("kgRetTot"),
    drivers:s("drivers"), driversNeeded:s("driversNeeded"), leads:s("leads") };
  T.cpk = div(T.spend, T.weight);
  T.newShare = div(T.newDonors, T.pickups);
  T.nCAC = div(T.newSpend, T.newDonors);
  T.rCAC = div(T.waSpend, T.retDonors);
  T.kgNewAvg = div(T.kgNewTot, T.newDonors);
  T.kgRetAvg = div(T.kgRetTot, T.retDonors);
  T.newKgShare = div(T.kgNewTot, T.weight);
  T.cpkNew = div(T.newSpend, T.kgNewTot);
  T.cpkRet = div(T.waSpend, T.kgRetTot);
  return T;
}

// Merit-order optimiser: buy new donors from the cheapest marginal channel until
// the stopping rule fires. Returns channel spends.
function meritOrder(cities, channels, st, pools, oh, stopFn, step){
  step = step || 250;
  const ch = channels.map(c=>({ ...c, spend: c.kind==="scalable" ? 0 : c.spend }));
  let plan = computePlan(cities, ch, st, pools, oh);
  for(let guard=0; guard<2000; guard++){
    if(stopFn(plan)) break;
    let best=null, bestCost=Infinity;
    ch.forEach((c,i)=>{
      if(c.kind!=="scalable" || c.spend + step > c.cap) return;
      const before = channelDonors(c, st);
      const trial = { ...c, spend: c.spend + step };
      const after = channelDonors(trial, st);
      const marg = div(step, after - before);
      if(marg < bestCost){ bestCost = marg; best = i; }
    });
    if(best===null) break;
    const saved = ch[best].spend;
    ch[best].spend += step;
    const next = computePlan(cities, ch, st, pools, oh);
    if(next.__overshoot){ ch[best].spend = saved; break; }
    plan = next;
  }
  return { channels: ch, plan };
}

// Scenario A: most kilos at or under the CPK target (returning at the chosen preset)
function solveMaxKgAtCPK(cities, channels, st, pools, oh){
  const ch = channels.map(c=>({ ...c, spend: c.kind==="scalable" ? 0 : c.spend }));
  let plan = computePlan(cities, ch, st, pools, oh);
  if(plan.cpk > st.targetCPK) return { channels: ch, plan, infeasible:true };
  const step = 250;
  for(let guard=0; guard<2000; guard++){
    let best=null, bestCost=Infinity;
    ch.forEach((c,i)=>{
      if(c.kind!=="scalable" || c.spend + step > c.cap) return;
      const d = channelDonors({ ...c, spend:c.spend+step }, st) - channelDonors(c, st);
      const m = div(step, d);
      if(m < bestCost){ bestCost=m; best=i; }
    });
    if(best===null) break;
    ch[best].spend += step;
    const next = computePlan(cities, ch, st, pools, oh);
    if(next.cpk > st.targetCPK){ ch[best].spend -= step; break; }
    plan = next;
  }
  return { channels: ch, plan };
}

// Scenario C: push new donors until the share target is met, whatever it costs
function solveShareAtMaxReturning(cities, channels, st, pools, oh){
  const ch = channels.map(c=>({ ...c, spend: c.kind==="scalable" ? 0 : c.spend }));
  let plan = computePlan(cities, ch, st, pools, oh);
  const step = 500;
  for(let guard=0; guard<3000 && plan.newShare < st.targetNewShare; guard++){
    let best=null, bestCost=Infinity;
    ch.forEach((c,i)=>{
      if(c.kind!=="scalable" || c.spend + step > c.cap) return;
      const d = channelDonors({ ...c, spend:c.spend+step }, st) - channelDonors(c, st);
      const m = div(step, d);
      if(m < bestCost){ bestCost=m; best=i; }
    });
    if(best===null) return { channels: ch, plan, capped:true };
    ch[best].spend += step;
    plan = computePlan(cities, ch, st, pools, oh);
  }
  return { channels: ch, plan, capped: plan.newShare < st.targetNewShare };
}

// Scenario B: most kilos meeting BOTH ratio targets, allowed to shrink returning
function solveBothRatios(cities, channels, st, pools, oh){
  let best = null;
  for(let i=100; i>=2; i-=2){
    const rs = i/100;
    const ch = channels.map(c=>({ ...c, spend: c.kind==="scalable" ? 0 : c.spend }));
    let plan = computePlan(cities, ch, st, pools, oh, rs);
    const step = 500;
    for(let guard=0; guard<1500 && plan.newShare < st.targetNewShare; guard++){
      let b=null, bc=Infinity;
      ch.forEach((c,j)=>{
        if(c.kind!=="scalable" || c.spend + step > c.cap) return;
        const d = channelDonors({ ...c, spend:c.spend+step }, st) - channelDonors(c, st);
        const m = div(step, d);
        if(m < bc){ bc=m; b=j; }
      });
      if(b===null) break;
      ch[b].spend += step;
      plan = computePlan(cities, ch, st, pools, oh, rs);
    }
    if(plan.newShare >= st.targetNewShare - 1e-6 && plan.cpk <= st.targetCPK + 1e-6){
      if(!best || plan.weight > best.plan.weight) best = { channels: ch, plan, returnScale: rs };
    }
  }
  return best;
}

// nCAC that would let both ratio targets hold at the chosen returning volume
function requiredNCAC(plan, st){
  const R = plan.retDonors, N = R * st.targetNewShare / (1 - st.targetNewShare);
  const kg = plan.kgRetTot + N * plan.kgNewAvg;
  return { N, ncac: div(st.targetCPK * kg - plan.waSpend - plan.overhead, N) };
}

const clone = x => JSON.parse(JSON.stringify(x));
PRESETS.custom = clone(PRESETS.max); PRESETS.custom.label = "Custom";
let cities = clone(CITY_BASE), channels = clone(CHANNELS_BASE), st = clone(SETTINGS_BASE),
    pools = clone(POOLS_BASE), overhead = clone(OVERHEAD_BASE);
let P, SC = null, scTimer = null;
const ohAwon = () => overhead.reduce((a,r)=>a+r.total*r.awonPct, 0);
const ohSutra = () => overhead.reduce((a,r)=>a+r.total*(1-r.awonPct), 0);

// September 2026 actuals, projected from 1-25 Sep (21 of 26 operating days):
// pickups and kilos from Odoo received orders, new/returning split from the cohort analysis (Sep 1-20),
// paid platform spend from Supermetrics (Sep 1-20, projected to 30 days).
const BASE_ACTUAL = { label:"September 2026", window:"1-25 Sep", newDonors:5084, retDonors:12448,
  pickups:17533, kgOdoo:376596, paidSpend:62610 };

function baseSettings(){ const s = clone(st); s.preset = "baseline"; s.levers = { exclude:false, snapRefresh:false, fast:false, capi:false }; return s; }
function basePlan(){ return computePlan(cities, CHANNELS_BASE, baseSettings(), pools, ohAwon()); }
function compute(){ P = computePlan(cities, channels, st, pools, ohAwon()); }

function computeScenarios(){
  const oh = ohAwon();
  const base = basePlan();
  const A = solveMaxKgAtCPK(cities, channels, st, pools, oh);
  const B = solveBothRatios(cities, channels, st, pools, oh);
  const C = solveShareAtMaxReturning(cities, channels, st, pools, oh);
  const req = requiredNCAC(A.plan, st);
  const steps = [];
  let s = baseSettings();
  steps.push({ key:"base", label:"September run-rate", plan: computePlan(cities, CHANNELS_BASE, s, pools, oh) });
  s = clone(s); s.preset = st.preset;
  steps.push({ key:"react", label:`Reactivation: ${PRESETS[st.preset].label.toLowerCase()}`, plan: computePlan(cities, CHANNELS_BASE, s, pools, oh) });
  [["exclude","Exclude existing donors from paid"],["snapRefresh","Refresh Snapchat creative"],["fast","48-hour first pickup"],["capi","Click-to-WhatsApp + CAPI"]]
    .forEach(([k,l])=>{ if(st.levers[k]){ s = clone(s); s.levers[k] = true; steps.push({ key:k, label:l, plan: computePlan(cities, CHANNELS_BASE, s, pools, oh) }); }});
  steps.push({ key:"realloc", label:"Reallocate budget to target", plan: A.plan });
  SC = { base: base, A, B, C, req, steps };
}
function scheduleScenarios(){ clearTimeout(scTimer); scTimer = setTimeout(()=>{ computeScenarios(); renderPlan(); }, 250); }

const n0 = v => isFinite(v) ? Math.round(v).toLocaleString("en-US") : "-";
const n1 = v => isFinite(v) ? v.toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1}) : "-";
const m0 = v => isFinite(v) ? "$"+Math.round(v).toLocaleString("en-US") : "-";
const m2 = v => isFinite(v) ? "$"+v.toFixed(2) : "-";
const m3 = v => isFinite(v) ? "$"+v.toFixed(3) : "-";
const pc = v => isFinite(v) ? (v*100).toFixed(1)+"%" : "-";
const pc0 = v => isFinite(v) ? Math.round(v*100)+"%" : "-";
const sg = v => v>=0 ? "+" : "−";
const N = s => `<span class="n">${s}</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderHero(){
  const base = basePlan();
  const d = div(P.weight, base.weight) - 1;
  const cOk = P.cpk <= st.targetCPK + 1e-6, sOk = P.newShare >= st.targetNewShare - 1e-6;
  const short = P.driversNeeded - P.drivers;
  document.getElementById("hero").innerHTML = `
    <div class="stat"><div class="l">${t("kilos")}</div><span class="v">${n0(P.weight)}<small>${t("kgU")}</small></span>
      <span class="pill soft">${t("vsAug", N(sg(d)+pc0(Math.abs(d))))}</span></div>
    <div class="stat"><div class="l">${t("cpk")}</div><span class="v">${m3(P.cpk)}</span>
      <span class="pill ${cOk?"good":"bad"}">${cOk ? t("onTarget") : t("over", N(m3(P.cpk-st.targetCPK)))}</span></div>

function scCard(key, cls, pillCls, pillTxt, p, note){
  const cOk = p.cpk <= st.targetCPK + 1e-6, sOk = p.newShare >= st.targetNewShare - 1e-6;
  return `<div class="sc ${cls}">
    <div class="t"><span>${t(key)}</span>${pillTxt?`<span class="pill ${pillCls}">${pillTxt}</span>`:""}</div>
    <dl>
      <dt>${t("kg")}</dt><dd class="n">${n0(p.weight)}</dd>
      <dt>${t("cpk")}</dt><dd class="n ${cOk?"good":"bad"}">${m3(p.cpk)}</dd>
      <dt>${t("share")}</dt><dd class="n ${sOk?"good":"bad"}">${pc0(p.newShare)}</dd>
    </dl>
    <div class="note">${note}</div></div>`;
}

          <button class="btn primary" id="optBtn">${t("optimise")}</button>

      </div>
    </div>`;
  if(!SC){ el.innerHTML = targetsCard; return; }
  const { base: base, A, B, C } = SC;
  const allOk = A.plan.newShare >= st.targetNewShare - 1e-6;
  const ratio = div(base.cpkNew, base.cpkRet);

  const cardA = scCard("scA","rec","good",t("rec"), A.plan, t("noteA", N("+"+pc0(div(A.plan.newDonors, base.newDonors)-1))));
  const cardB = B ? scCard("scB","","warn", B.plan.weight < base.weight ? t("fewer") : "", B.plan,
      B.plan.weight < base.weight ? t("noteB", N(pc0(1-B.returnScale)), N(n0(base.weight-B.plan.weight))) : t("noteBmore", N(pc0(1-B.returnScale))))
    : `<div class="sc"><div class="t"><span>${t("scB")}</span><span class="pill bad">${t("infeasible")}</span></div></div>`;
  const cardC = scCard("scC","","bad", C.plan.cpk > st.targetCPK ? t("over2") : "", C.plan,

  const kgMax = Math.max(...SC.steps.map(s=>s.plan.weight));
  const steps = SC.steps.map((s,i)=>{
    const prev = i ? SC.steps[i-1].plan.weight : 0;
    return `<div class="step ${i===SC.steps.length-1?"last":""}">
      <div>${t("step_"+s.key)}</div>
      <div class="track"><div class="fill" style="width:${div(s.plan.weight,kgMax)*100}%"></div></div>

    </div>`;
  }).join("");

  const short = A.plan.driversNeeded - A.plan.drivers;
  const partner = A.channels.find(c=>c.id==="partner");
  el.innerHTML = targetsCard + `
    <div class="card">
      <p class="verdict">${allOk ? t("verdictOk", N(m2(st.targetCPK))) : t("verdict", N(m2(st.targetCPK)), N(pc0(st.targetNewShare)))}</p>
      <p class="lead">${t("verdictBody", N(Math.round(ratio)))}</p>
      <div class="scen">${cardA}${cardB}${cardC}</div>
      ${allOk ? "" : `<p class="foot" style="margin-top:14px">${t("suggest", N(n0(Math.floor(A.plan.newDonors/100)*100)+"+"))}</p>`}

// ================= events =================
function rerenderKeeping(el, selector){
  const raw = el.value; let pos = null;
  try { pos = el.selectionStart; } catch(_){}
  render();
  const again = document.querySelector(selector);
  if(again){ again.value = raw; again.focus(); if(pos!==null){ try{ again.setSelectionRange(pos,pos); }catch(_){} } }
}
const num = v => v === "" ? 0 : Number(v);

document.addEventListener("input", e=>{
  const x = e.target, d = x.dataset;
  if(d.ch){ const c = channels.find(y=>y.id===d.ch); if(!c) return; c[d.key] = num(x.value); rerenderKeeping(x, `[data-ch="${d.ch}"][data-key="${d.key}"]`); }
  else if(d.city){ const c = cities.find(y=>y.id===Number(d.city)); if(!c) return; c[d.key] = num(x.value); rerenderKeeping(x, `[data-city="${d.city}"][data-key="${d.key}"]`); }
  else if(d.pool){ pools[d.pool] = num(x.value); rerenderKeeping(x, `[data-pool="${d.pool}"]`); }
  else if(d.rate || d.rcac){
    if(st.preset !== "custom"){ PRESETS.custom = clone(PRESETS[st.preset]); PRESETS.custom.label = "Custom"; st.preset = "custom"; }
    if(d.rate) PRESETS.custom.rate[d.rate] = num(x.value); else PRESETS.custom.rcac[d.rcac] = num(x.value);
    rerenderKeeping(x, d.rate ? `[data-rate="${d.rate}"]` : `[data-rcac="${d.rcac}"]`);
  }
  else if(d.set){ st[d.set] = num(x.value); rerenderKeeping(x, `[data-set="${d.set}"]`); }
  else if(d.oh && x.tagName !== "SELECT"){
    const r = overhead.find(y=>y.id===Number(d.oh)); if(!r) return;
    r[d.key] = d.key==="item" ? x.value : num(x.value); rerenderKeeping(x, `[data-oh="${d.oh}"][data-key="${d.key}"]`);
  }
  else if(x.id==="tCPK"){ st.targetCPK = num(x.value); rerenderKeeping(x, "#tCPK"); }
  else if(x.id==="tShare"){ st.targetNewShare = num(x.value); rerenderKeeping(x, "#tShare"); }
  else if(x.id==="monthLabel"){ st.monthLabel = x.value; }
});

document.addEventListener("change", e=>{
  const x = e.target, d = x.dataset;
  if(d.oh && x.tagName==="SELECT"){ const r = overhead.find(y=>y.id===Number(d.oh)); if(r){ r.type = x.value; render(); } }
});

function applyA(){
  const A = solveMaxKgAtCPK(cities, channels, st, pools, ohAwon());
  A.channels.forEach(c=>{ const y = channels.find(z=>z.id===c.id); if(y) y.spend = c.spend; });
  render();
  toast(t("toastOpt", n0(A.plan.weight), m3(A.plan.cpk)));
}
function setLang(l){
  lang = l;
  try { history.replaceState(null, "", "#" + l); } catch(_){}
  try { localStorage.setItem("awonLang", l); } catch(_){}
  render();
}

document.addEventListener("click", e=>{
  const x = e.target.closest("button,[data-lever],[data-tab]") || e.target, d = x.dataset;
  if(d.lang){ setLang(d.lang); return; }
  if(d.lever){ st.levers[d.lever] = !st.levers[d.lever]; render(); return; }
  if(d.preset){ st.preset = d.preset; render(); return; }
  if(x.id==="optBtn") applyA();
  if(x.id==="augBtn"){ channels = clone(CHANNELS_BASE); st.preset = "baseline"; st.levers = { exclude:false, snapRefresh:false, fast:false, capi:false }; render(); toast(t("toastAug")); }
  if(x.id==="addOh"){ overhead.push({ id:Date.now(), type:"Other", item:"", total:0, awonPct:0.85 }); render(); }
  if(d.ohrm){ overhead = overhead.filter(r=>r.id!==Number(d.ohrm)); render(); }
  if(d.tab){
    document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b===x));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on", p.id==="panel-"+d.tab));
  }
  if(x.id==="exportBtn") exportExcel();
});
document.addEventListener("keydown", e=>{
  if((e.key===" "||e.key==="Enter") && e.target.dataset && e.target.dataset.lever){ e.preventDefault(); e.target.click(); }
});

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ el.style.display = "none"; }, 4000);
}

const BRAND = "FF1D4A4F", BRAND_DEEP = "FF123236", BRAND_TINT = "FFDCE8E7", BRAND_WASH = "FFEFF5F4",
      SUTRA_C = "FFA2643A", SUTRA_TINT = "FFF1E6DA", INPUT_FILL = "FFFFF6E3", RULE = "FFD5D8D2",
      WHITE = "FFFFFFFF", INK = "FF16211F", DIM = "FF63706E";

const FONT = "Arial";
const fill = c => ({ type:"pattern", pattern:"solid", fgColor:{argb:c} });
const thin = { style:"thin", color:{argb:RULE} };
const box = { top:thin, left:thin, bottom:thin, right:thin };

const NF = { money:'$#,##0;($#,##0);"–"', money2:'$#,##0.00;($#,##0.00);"–"',
             money3:'$#,##0.000;($#,##0.000);"–"', num:'#,##0;(#,##0);"–"',
             num1:'#,##0.0;(#,##0.0);"–"', pct:'0.0%' };

function styleTitle(ws, range, text, sub, colour){
  ws.mergeCells(range);
  const c = ws.getCell(range.split(":")[0]);
  c.value = text;
  c.font = { name:FONT, size:16, bold:true, color:{argb:WHITE} };
  c.fill = fill(colour || BRAND);
  c.alignment = { vertical:"middle", horizontal:"left", indent:1 };
  ws.getRow(c.row).height = 30;
  if(sub){
    const r2 = c.row + 1;
    const end = range.split(":")[1].replace(/\d+/, r2);
    ws.mergeCells(`A${r2}:${end}`);
    const s = ws.getCell(`A${r2}`);
    s.value = sub;
    s.font = { name:FONT, size:9, italic:true, color:{argb:DIM} };
    s.alignment = { vertical:"middle", horizontal:"left", indent:1 };
    ws.getRow(r2).height = 18;
  }
}

function bandRow(ws, row, spans, colour){
  spans.forEach(([from,to,label])=>{
    ws.mergeCells(`${from}${row}:${to}${row}`);
    const c = ws.getCell(`${from}${row}`);
    c.value = label;
    c.font = { name:FONT, size:9, bold:true, color:{argb:colour} };
    c.fill = fill(BRAND_TINT);
    c.alignment = { horizontal:"center", vertical:"middle" };
    c.border = box;
  });
  ws.getRow(row).height = 18;
}

function headerRow(ws, row, map, colour){
  Object.entries(map).forEach(([col,label])=>{
    const c = ws.getCell(col+row);
    c.value = label;
    c.font = { name:FONT, size:9, bold:true, color:{argb:WHITE} };
    c.fill = fill(colour);
    c.alignment = { horizontal:"center", vertical:"bottom", wrapText:true };
    c.border = box;
  });
  ws.getRow(row).height = 42;
}

function put(ws, addr, value, opts){
  const c = ws.getCell(addr);
  c.value = value;
  const o = opts || {};
  c.font = { name:FONT, size:10, bold:!!o.bold, color:{argb:o.colour || INK} };
  if(o.numFmt) c.numFmt = o.numFmt;
  if(o.fill) c.fill = fill(o.fill);
  c.border = box;
  c.alignment = { horizontal: o.align || (typeof value === "object" || typeof value === "number" ? "right" : "left"),
                  vertical:"middle", indent: o.align === "left" || typeof value === "string" ? 1 : 0 };
  return c;
}
const F = (formula, result) => ({ formula, result: isFinite(result) ? result : 0 });

function sectionHead(ws, row, from, to, text, colour){
  ws.mergeCells(`${from}${row}:${to}${row}`);
  const c = ws.getCell(`${from}${row}`);
  c.value = text;
  c.font = { name:FONT, size:11, bold:true, color:{argb:WHITE} };
  c.fill = fill(colour || BRAND_DEEP);
  c.alignment = { vertical:"middle", horizontal:"left", indent:1 };
  ws.getRow(row).height = 22;
}

     ["L",P.otherSpend,NF.money],["M",P.otherNew,NF.num],["N",P.newSpend,NF.money],["P",P.waSpend,NF.money],
     ["S",P.drivers,NF.num],["U",P.pickups,NF.num],["Y",P.kgNewTot,NF.num],["Z",P.kgRetTot,NF.num],
     ["AA",P.weight,NF.num],["AB",P.rows.reduce((a,c)=>a+c.dailyWeight,0),NF.num],["AE",P.driversNeeded,NF.num],["AF",P.leads,NF.num],
     ["AJ",P.rows.reduce((a,c)=>a+c.paidShare,0),NF.pct],["AK",P.rows.reduce((a,c)=>a+c.baseShare,0),NF.pct]]
      .forEach(([c,v,f])=>TD(c+TOT, F(`SUM(${rg(c)})`, v), f));
    TD("G"+TOT, F(`IFERROR(E${TOT}/D${TOT},0)`, P.newShare), NF.pct);
    TD("O"+TOT, F(`IFERROR(N${TOT}/E${TOT},0)`, P.nCAC), NF.money2);
    TD("Q"+TOT, F(`IFERROR(P${TOT}/F${TOT},0)`, P.rCAC), NF.money2);
    const avgDays = P.rows.reduce((a,c)=>a+c.days,0)/n;
    TD("T"+TOT, F(`AVERAGE(${rg("T")})`, avgDays), NF.num1);
    TD("V"+TOT, F(`IFERROR(U${TOT}/T${TOT}/S${TOT},0)`, div(div(P.pickups,avgDays),P.drivers)), NF.num1);
    TD("W"+TOT, F(`IFERROR(Y${TOT}/E${TOT},0)`, P.kgNewAvg), NF.num1);
    TD("X"+TOT, F(`IFERROR(Z${TOT}/F${TOT},0)`, P.kgRetAvg), NF.num1);
    TD("AC"+TOT, F(`AVERAGE(${rg("AC")})`, P.rows.reduce((a,c)=>a+c.carCap,0)/n), NF.num);
    TD("AD"+TOT, "", NF.pct);
    TD("AG"+TOT, F(`IFERROR(C${TOT}/AA${TOT},0)`, div(P.direct,P.weight)), NF.money3);
    TD("AH"+TOT, F(`IFERROR(C${TOT}/D${TOT},0)`, div(P.direct,P.pickups)), NF.money2);
    ["AL","AM"].forEach(c=>TD(c+TOT, "", NF.num));
    ws.getRow(TOT).height = 20;

    // Now that the total row is known, point channel kg at the forecast's average new kg/pickup
    nc.eachRow(row=>row.eachCell(cell=>{
      if(cell.value && typeof cell.value==="object" && cell.value.formula && cell.value.formula.includes("__KGNEW__"))
        cell.value = { formula: cell.value.formula.replace(/__KGNEW__/g, `'${mainName}'!$W$${TOT}`), result: cell.value.result };
    }));

    // Executive summary
    let E0 = TOT + 3;
    sectionHead(ws, E0, "A", "F", "EXECUTIVE SUMMARY AGAINST TARGET");
    const exec = [
      ["Target cost per kg", A_(AR.cpk), st.targetCPK, NF.money3],
      ["Forecast cost per kg (all-in)", `IFERROR((C${TOT}+${OH})/AA${TOT},0)`, P.cpk, NF.money3, "cpk"],
      ["Target new-donor share", A_(AR.share), st.targetNewShare, NF.pct],
      ["Forecast new-donor share", `G${TOT}`, P.newShare, NF.pct, "share"],
      ["New donors", `E${TOT}`, P.newDonors, NF.num],
      ["Returning donors", `F${TOT}`, P.retDonors, NF.num],
      ["Total pickups", `U${TOT}`, P.pickups, NF.num],
      ["Target weight (kg)", `AA${TOT}`, P.weight, NF.num],
      ["  From new donors", `Y${TOT}`, P.kgNewTot, NF.num],
      ["  From returning donors", `Z${TOT}`, P.kgRetTot, NF.num],
      ["Direct marketing budget", `C${TOT}`, P.direct, NF.money],
      ["  New-donor budget", `N${TOT}`, P.newSpend, NF.money],
      ["  WhatsApp reactivation", `P${TOT}`, P.waSpend, NF.money],
      ["Marketing overhead (Awon share)", OH, P.overhead, NF.money],
      ["Total spending", `C${TOT}+${OH}`, P.spend, NF.money],
      ["nCAC: (paid + organic) ÷ new donors", `O${TOT}`, P.nCAC, NF.money2],
      ["rCAC: WhatsApp spend ÷ returning donors", `Q${TOT}`, P.rCAC, NF.money2],
      ["Cost per first-pickup kg", `IFERROR(N${TOT}/Y${TOT},0)`, P.cpkNew, NF.money3],
      ["Cost per returning kg", `IFERROR(P${TOT}/Z${TOT},0)`, P.cpkRet, NF.money3],
      ["Drivers on roster", `S${TOT}`, P.drivers, NF.num],
      ["Drivers needed", `AE${TOT}`, P.driversNeeded, NF.num, "drv"]
    ];
    exec.forEach(([l,f,v,fmt,flag],i)=>{ const R = E0+1+i, wash = i%2 ? BRAND_WASH : null;
      ws.mergeCells(`A${R}:B${R}`);
      put(ws, "A"+R, l, { align:"left", fill:wash, bold: !l.startsWith("  ") });
      let colour = INK;
      if(flag==="cpk") colour = v <= st.targetCPK+1e-6 ? GREEN_OK : RED_BAD;
      if(flag==="share") colour = v >= st.targetNewShare-1e-6 ? GREEN_OK : RED_BAD;
      if(flag==="drv") colour = v <= P.drivers ? GREEN_OK : RED_BAD;
      put(ws, "C"+R, F(f, v), { numFmt:fmt, bold:true, colour, fill:wash });
      if(flag==="cpk") put(ws, "D"+R, F(`IF(C${R}<=C${R-1},"On target","Above target")`, v<=st.targetCPK+1e-6?"On target":"Above target"), { align:"left", bold:true, colour, fill:wash });
      if(flag==="share") put(ws, "D"+R, F(`IF(C${R}>=C${R-1},"On target","Below target")`, v>=st.targetNewShare-1e-6?"On target":"Below target"), { align:"left", bold:true, colour, fill:wash });
      if(flag==="drv") put(ws, "D"+R, F(`IF(C${R}<=C${R-1},"Covered","Short "&(C${R}-C${R-1}))`, v<=P.drivers?"Covered":"Short "+(v-P.drivers)), { align:"left", bold:true, colour, fill:wash });
    });

    // City spend with overhead on driver share
    let C0 = E0 + exec.length + 3;
    sectionHead(ws, C0, "A", "J", "CITY SPEND: DIRECT BUDGET PLUS OVERHEAD ON DRIVER SHARE");
    headerRow(ws, C0+1, { A:"City", B:"Drivers", C:"Driver share", D:"Direct budget", E:"Overhead carried", F:"City spend",
      G:"Kilos", H:"CPK (all-in)", I:"New share", J:"vs target CPK" }, BRAND);
    P.rows.forEach((c,i)=>{ const R = C0+2+i, src = H0+i, wash = i%2 ? BRAND_WASH : null;
      put(ws, "A"+R, c.city, { align:"left", bold:true, fill:wash });
      put(ws, "B"+R, F(`S${src}`, c.drivers), { numFmt:NF.num, fill:wash });
      put(ws, "C"+R, F(`IFERROR(B${R}/$S$${TOT},0)`, div(c.drivers,P.drivers)), { numFmt:NF.pct, fill:wash });
      put(ws, "D"+R, F(`C${src}`, c.direct), { numFmt:NF.money, fill:wash });
      put(ws, "E"+R, F(`${OH}*C${R}`, c.ohShare), { numFmt:NF.money, fill:wash });
      put(ws, "F"+R, F(`D${R}+E${R}`, c.spend), { numFmt:NF.money, bold:true, fill:wash });
      put(ws, "G"+R, F(`AA${src}`, c.weight), { numFmt:NF.num, fill:wash });
      const ok = c.cpk <= st.targetCPK+1e-6;
      put(ws, "H"+R, F(`IFERROR(F${R}/G${R},0)`, c.cpk), { numFmt:NF.money3, bold:true, colour: ok?GREEN_OK:RED_BAD, fill:wash });
      put(ws, "I"+R, F(`G${src}`, c.newShare), { numFmt:NF.pct, fill:wash });
      put(ws, "J"+R, F(`H${R}-${A_(AR.cpk)}`, c.cpk-st.targetCPK), { numFmt:'+$0.000;-$0.000;"–"', colour: ok?GREEN_OK:RED_BAD, fill:wash });
    });
    const CT = C0+2+n, dk = { bold:true, colour:WHITE, fill:BRAND_DEEP };
    put(ws, "A"+CT, "TOTAL", { ...dk, align:"left" });
    put(ws, "B"+CT, F(`SUM(B${C0+2}:B${CT-1})`, P.drivers), { ...dk, numFmt:NF.num });
    put(ws, "C"+CT, F(`SUM(C${C0+2}:C${CT-1})`, 1), { ...dk, numFmt:NF.pct });
    put(ws, "D"+CT, F(`SUM(D${C0+2}:D${CT-1})`, P.direct), { ...dk, numFmt:NF.money });
    put(ws, "E"+CT, F(`SUM(E${C0+2}:E${CT-1})`, P.overhead), { ...dk, numFmt:NF.money });
    put(ws, "F"+CT, F(`SUM(F${C0+2}:F${CT-1})`, P.spend), { ...dk, numFmt:NF.money });
    put(ws, "G"+CT, F(`SUM(G${C0+2}:G${CT-1})`, P.weight), { ...dk, numFmt:NF.num });
    put(ws, "H"+CT, F(`IFERROR(F${CT}/G${CT},0)`, P.cpk), { ...dk, numFmt:NF.money3 });
    put(ws, "I"+CT, F(`G${TOT}`, P.newShare), { ...dk, numFmt:NF.pct });
    put(ws, "J"+CT, F(`H${CT}-${A_(AR.cpk)}`, P.cpk-st.targetCPK), { ...dk, numFmt:'+$0.000;-$0.000;"–"' });

    /* ---------------- September Baseline ---------------- */
    const a = SC.base;
    bl.columns = [{width:30},{width:15},{width:15},{width:12},{width:64}];
    styleTitle(bl, "A1:E1", "SEPTEMBER 2026: DOES THE MODEL REPRODUCE IT?", "September spends, no levers, run-rate reactivation, against September projected from 1-25 Sep (21 of 26 operating days)");
    headerRow(bl, 4, { A:"Measure", B:"Model", C:"Actual", D:"Gap", E:"Actual from" }, BRAND);
    [["New donors", a.newDonors, BASE_ACTUAL.newDonors, NF.num, "Odoo pickups, split with the cohort analysis (71% returning, 1-20 Sep)"],
     ["Returning donors", a.retDonors, BASE_ACTUAL.retDonors, NF.num, "As above"],
     ["New share", a.newShare, BASE_ACTUAL.newDonors/(BASE_ACTUAL.newDonors+BASE_ACTUAL.retDonors), NF.pct, "As above"],
     ["Kilos", a.weight, BASE_ACTUAL.kgOdoo, NF.num, "Odoo received orders: 304,173 kg over 1-25 Sep, projected"],
     ["Paid platform spend", a.paidSpend, BASE_ACTUAL.paidSpend, NF.money, "Supermetrics, 1-20 Sep, projected to 30 days"],
     ["Cost per kg", a.cpk, null, NF.money3, "Full September spend not yet closed; see dashboard.awonksa.com"],
     ["nCAC", a.nCAC, null, NF.money2, "Paid-only cost per genuinely new donor was $28 in Aug-Sep"],
     ["rCAC", a.rCAC, null, NF.money2, "WhatsApp spend per returning donor"],
     ["Cost per first-pickup kg", a.cpkNew, null, NF.money3, "New-donor spend ÷ first-pickup kilos"],
     ["Cost per returning kg", a.cpkRet, null, NF.money3, "WhatsApp spend ÷ returning kilos"]]
      .forEach(([l,m,act,f,src],i)=>{ const R = 5+i, wash = i%2 ? BRAND_WASH : null;
        put(bl, "A"+R, l, { align:"left", bold:true, fill:wash });
        put(bl, "B"+R, m, { numFmt:f, fill:wash });
        put(bl, "C"+R, act===null ? "" : act, { numFmt:f, fill:wash });
        put(bl, "D"+R, act===null ? "" : F(`IFERROR(B${R}/C${R}-1,0)`, m/act-1), { numFmt:'+0.0%;-0.0%;"-"', fill:wash });
        put(bl, "E"+R, src, { align:"left", fill:wash });
      });

    /* ---------------- Read Me ---------------- */
    rm.columns = [{width:4},{width:120}];
    styleTitle(rm, "A1:B1", `MODEL NOTES · AWON ${ML.toUpperCase()} FORECAST, NEW & RETURNING DONORS`, `Generated ${stamp}`);
    const lines = [
      ["h","How to read this workbook"],
      ["p",`'${mainName}' keeps the old forecast's shape (one row per city, a total row, an executive summary and city spend with overhead) but splits every donor, kilo and dollar into new and returning.`],
      ["p","Shaded cells are inputs. Every other number is a live formula, so changing a channel's spend, a return rate or a city's driver count recalculates the whole month."],
      ["k","Shaded cells are inputs. White cells are formulas. Dark rows are totals. Green / red marks on-target / off-target."],
      ["h","Definitions (same as dashboard.awonksa.com)"],
      ["p","New donor: a phone number whose first-ever received donation falls in the month, matched across Odoo and the legacy customer data."],
      ["p","Returning donor: a phone number that donates in the month and has donated before."],
      ["p","nCAC = (paid + organic spend) ÷ new donors.   rCAC = WhatsApp spend ÷ returning donors."],
      ["h","How new donors are forecast"],
      ["p","Each channel converts spend into new donors at its own cost per genuinely new donor, measured Aug–Sep 2026: Google $18.50, Snapchat $34, Meta $215, TikTok $138."],
      ["p","Channels get dearer as spend rises: effective cost per new donor = base × lever factor × (spend ÷ average Aug-Sep spend) ^ elasticity. This is why the optimiser stops adding to Google rather than moving everything there."],
      ["p","Paid new donors land in cities by the old forecast's paid-budget split. Partner, organic and WhatsApp-new donors land by each city's share of the donor base."],
      ["h","How returning donors are forecast"],
      ["p","From the donor base on 20 Sep 2026, by recency: active (≤90 days), due (91–180), lapsing (181–365), dormant (365+). Each segment returns at a monthly rate and costs an rCAC."],
      ["p","The September run-rate is calibrated to reproduce September: about 12.4K returning donors. Always-on and maximum raise the return rate on due, lapsing and dormant donors. Active donors are left alone."],
      ["p","Each city's returning volume is its share of the base times a repeat index. Makkah repeats at half the rate of Riyadh and Jeddah over twelve months, so its index is 0.53."],
      ["h","Kilos"],
      ["p","Each city's kg per pickup (Odoo received orders, Aug-Sep 2026) is split into new and returning using the cohort ratio: first pickups run about 1.29× a returning pickup."],
      ["h","The October targets"],
      ["p",`Plan A hits ${m2(st.targetCPK)} per kg and collects the most kilos it can. It grows new donors ${pc0(div(A.plan.newDonors,aug.newDonors)-1)} on September but reaches a ${pc0(A.plan.newShare)} new share, because returning donors grow faster.`],
      ["p",`Hitting ${pc0(st.targetNewShare)} new and ${m2(st.targetCPK)} together requires either an nCAC of ${m2(req.ncac)} (September: ${m2(aug.nCAC)}), or switching off part of the reactivation program and collecting fewer kilos. See the Assumptions sheet.`],
      ["p","Recommendation: keep the cost-per-kg target, and set acquisition as a volume target (new donors) rather than a share."],
      ["h","Assumptions to watch"],
      ["p","Partner channel: co-branded partner acquisition at ALDERAYEA's historical ~$12 per new donor, capped at its historical ~1,500 a month. It is not running today."],
      ["p","Maximum reactivation: 19% of due and 7.5% of lapsing donors in one month. Only achieved in bursts so far."],
      ["p","Exclusion audiences: modelled as 15% cheaper new donors on every paid platform."],
      ["p","Fleet: drivers needed assumes at most the pickups-per-day setting and never more kilos than car capacity."],
      ["p","Sutra is excluded, as on the live dashboard."],
      ["p","Sources: Odoo received orders (Aug and 1-25 Sep 2026); cohort analysis (253,599 donors, phone-matched, Jan 2024 to Sep 2026); Supermetrics platform spend; _Forecast_2024-2026.xlsx."]
    ];
    let rr = 4;
    lines.forEach(([kind,text])=>{
      if(kind==="h"){ rr++; sectionHead(rm, rr, "A", "B", text.toUpperCase()); }
      else if(kind==="k"){ rm.getCell("A"+rr).fill = fill(INPUT_FILL); rm.getCell("A"+rr).border = box;
        const c = rm.getCell("B"+rr); c.value = text; c.font = { name:FONT, size:10, italic:true, color:{argb:DIM} }; c.alignment = { indent:1 }; }
      else { const c = rm.getCell("B"+rr); c.value = text; c.font = { name:FONT, size:10, color:{argb:INK} }; c.alignment = { indent:1, wrapText:true, vertical:"top" };
        rm.getRow(rr).height = text.length > 130 ? 28 : 16; }
      rr++;
    });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `Awon_${ML.replace(/\s+/g,"_")}_Forecast_New_Returning.xlsx`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast(t("downloaded") + " · " + link.download);
  } catch(err){
    console.error(err); toast("Export failed: " + err.message);
  }
}
// ==== EXPORT END ===========================================================

document.getElementById("wordmark").src = "data:image/png;base64," + WORDMARK;
(function init(){
  let l = (location.hash || "").replace("#","");
  if(l !== "ar" && l !== "en"){ try { l = localStorage.getItem("awonLang") || "en"; } catch(_){ l = "en"; } }
  lang = l === "ar" ? "ar" : "en";
  const A0 = solveMaxKgAtCPK(cities, channels, st, pools, ohAwon());
  A0.channels.forEach(c=>{ const y = channels.find(z=>z.id===c.id); if(y) y.spend = c.spend; });
  render();
})();
</script>
