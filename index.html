<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awon — October 2026 Forecast · New &amp; Returning Donors</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --brand:#1D4A4F; --brand-deep:#123236; --brand-mid:#2E6B6F; --brand-tint:#DCE8E7; --brand-wash:#EEF4F3;
  --sutra:#A2643A; --sutra-deep:#6E4426; --sutra-tint:#F1E6DA;
  --paper:#F3F2ED; --card:#FFFFFF; --ink:#16211F; --dim:#63706E; --rule:#D5D8D2;
  --input:#FFF6E3; --input-line:#E0C98C; --alert:#A33A1E; --warn:#B8862B; --ok:#2E6B4F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:14px;line-height:1.45;padding-bottom:64px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

header.mast{background:var(--brand);color:#fff;padding:18px 26px;display:flex;flex-wrap:wrap;gap:20px;
  align-items:center;justify-content:space-between}
.lockup{display:flex;align-items:center;gap:18px}
.lockup img{height:52px;width:auto;display:block}
.lockup .divider{width:1px;height:44px;background:rgba(255,255,255,.35)}
.lockup .sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  opacity:.78;line-height:1.7}
.lockup .sub b{display:block;font-size:13px;letter-spacing:.06em;font-weight:600;opacity:1}
.mhright{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.field input{font-family:'IBM Plex Mono',monospace;font-size:13px;padding:8px 10px;border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.1);color:#fff;border-radius:3px;width:150px}
.btn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  background:#fff;color:var(--brand);border:none;padding:12px 18px;border-radius:3px;cursor:pointer;font-weight:600;
  transition:transform .12s ease,box-shadow .2s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);font-weight:400}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.line{background:transparent;color:var(--brand);border:1px solid var(--rule)}
.btn.line:hover{background:var(--brand);color:#fff}
.btn.solid{background:var(--brand);color:#fff}
.btn.solid:hover{background:var(--brand-deep)}
#toast{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:8px 12px;background:rgba(255,255,255,.15);
  border-left:3px solid #fff;align-self:center;display:none;max-width:340px}

.readout{background:var(--brand-deep);color:#fff;padding:22px 26px 24px;display:flex;flex-wrap:wrap;gap:34px;align-items:flex-start}
.rblock{min-width:190px}
.kg{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:clamp(28px,4.6vw,46px);letter-spacing:-.03em;line-height:1.05}
.kg small{font-size:.3em;letter-spacing:.18em;opacity:.55;margin-left:8px}
.kg.plan{opacity:.55}
.kg.gap{color:#F0B67F}
.rnote{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.7;margin-top:5px}
.bar{display:flex;height:12px;margin-top:16px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.12);width:100%}
.seg{transition:width .45s cubic-bezier(.4,0,.2,1);border-right:1px solid var(--brand-deep)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;font-size:11px;font-family:'IBM Plex Mono',monospace;opacity:.85}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:1px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:1px;background:var(--rule)}
.kpi{background:var(--card);padding:12px 15px}
.kpi b{display:block;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;margin-top:4px}
.kpi .sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-top:2px}

nav.tabs{display:flex;padding:0 26px;background:var(--card);border-bottom:1px solid var(--rule);flex-wrap:wrap;
  position:sticky;top:0;z-index:20;overflow-x:auto}
.tab{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:none;border-bottom:3px solid transparent;padding:14px 15px;cursor:pointer;color:var(--dim);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab.on.sutra{color:var(--sutra);border-bottom-color:var(--sutra)}

.panel{padding:26px;display:none}
.panel.on{display:block}
.sec{margin-bottom:34px}
.sec h3{font-size:17px;font-weight:700;margin:2px 0 3px}
.sec p.note{font-size:12.5px;color:var(--dim);margin:0 0 14px;max-width:80ch}
.scroll{overflow-x:auto;border:1px solid var(--rule);background:var(--card);border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:#fff;
  font-weight:500;text-align:right;padding:9px 8px;background:var(--brand);white-space:nowrap;vertical-align:bottom}
.sutra th{background:var(--sutra)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:2}
th:first-child{background:var(--brand)} .sutra th:first-child{background:var(--sutra)}
td:first-child{background:var(--card);border-right:1px solid var(--rule);font-weight:600;padding:7px 8px}
td{padding:0;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
td.calc{padding:7px 8px;font-family:'IBM Plex Mono',monospace}
td.calc.soft{color:var(--dim)}
td.txt{padding:7px 8px;text-align:left;white-space:normal;font-weight:400}
tbody tr:nth-child(even) td{background:var(--brand-wash)}
tbody tr:nth-child(even) td:first-child{background:var(--brand-wash)}
.sutra tbody tr:nth-child(even) td,.sutra tbody tr:nth-child(even) td:first-child{background:var(--sutra-tint)}
tr.total td{background:var(--brand-deep)!important;color:#fff;font-weight:600;padding:8px;
  font-family:'IBM Plex Mono',monospace;border-bottom:none}
.sutra tr.total td{background:var(--sutra-deep)!important}
tr.sub td{background:var(--brand-tint)!important;font-weight:600;font-family:'IBM Plex Mono',monospace;padding:7px 8px}
input.cell{width:100%;min-width:76px;border:none;background:var(--input);padding:7px 8px;text-align:right;
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);box-shadow:inset 0 -1px 0 var(--input-line)}
input.cell:focus{outline:2px solid var(--brand);outline-offset:-2px;background:#fff}
input.cell.text{text-align:left;min-width:120px}
input.cell.hot{background:#FDE8E0;box-shadow:inset 0 -2px 0 var(--alert)}
input.cell.warm{background:#FBF0D8;box-shadow:inset 0 -2px 0 var(--warn)}
select.cell{width:100%;min-width:150px;border:none;background:var(--input);padding:6px 8px;
  font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;color:var(--ink);box-shadow:inset 0 -1px 0 var(--input-line)}
.rm{border:none;background:none;color:var(--dim);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:15px;padding:4px 9px}
.rm:hover{color:var(--alert)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.summary div{background:var(--card);padding:13px 15px}
.summary b{display:block;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;margin-top:4px}
.summary div.hl{background:var(--brand-tint)} .summary div.hls{background:var(--sutra-tint)}
.flag{font-size:12.5px;background:var(--card);border-left:3px solid var(--alert);padding:11px 14px;margin-top:12px;border-radius:0 3px 3px 0}
.flag.warn{border-left-color:var(--warn)} .flag.ok{border-left-color:var(--ok)} .flag.info{border-left-color:var(--brand-mid)}
.legendkey{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin:10px 0 0}
.legendkey i{display:inline-block;width:11px;height:11px;margin-right:6px;border:1px solid var(--input-line);
  background:var(--input);vertical-align:-1px}
.legendkey i.hot{background:#FDE8E0;border-color:var(--alert)}
.legendkey i.warm{background:#FBF0D8;border-color:var(--warn)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:7px 13px;border:1px solid var(--rule);
  background:var(--card);border-radius:14px;cursor:pointer;color:var(--dim)}
.pill.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pill.mtd{border-style:dashed}
.bridge{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.brow{display:grid;grid-template-columns:200px 1fr 130px;gap:12px;align-items:center;font-size:12.5px}
.btrack{height:22px;background:var(--brand-wash);position:relative;border-radius:2px;overflow:hidden}
.bfill{position:absolute;top:0;bottom:0;transition:all .4s ease}
.bfill.neg{background:var(--alert)} .bfill.pos{background:var(--ok)}
.bval{font-family:'IBM Plex Mono',monospace;text-align:right;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:15px 17px;border-top:3px solid var(--brand)}
.card.alert{border-top-color:var(--alert)} .card.warn{border-top-color:var(--warn)} .card.ok{border-top-color:var(--ok)}
.card h4{margin:0 0 4px;font-size:14.5px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h4 span{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.card p{margin:6px 0 0;font-size:12.5px;color:var(--ink)}
.card .metricline{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--dim);margin-top:8px}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--brand)}
.spark{display:inline-flex;gap:2px;align-items:flex-end;height:18px;vertical-align:-3px;margin-left:6px}
.spark i{width:5px;background:var(--brand-mid);display:block;border-radius:1px}
@media (max-width:640px){header.mast,.panel,.readout{padding:16px}nav.tabs{padding:0 8px}.brow{grid-template-columns:110px 1fr 90px}}
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.scard{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:16px 17px;border-top:4px solid var(--rule);position:relative}
.scard.rec{border-top-color:var(--ok);box-shadow:0 2px 14px rgba(46,107,79,.12)}
.scard.bad{border-top-color:var(--alert)} .scard.meh{border-top-color:var(--warn)} .scard.base{border-top-color:var(--brand-mid)}
.scard h4{margin:0 0 2px;font-size:14.5px;padding-right:112px}
.scard .tag{position:absolute;top:12px;right:12px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;padding:3px 8px;border-radius:10px;background:var(--brand-wash);color:var(--brand)}
.scard .tag.ok{background:#E3F0E8;color:var(--ok)} .scard .tag.bad{background:#FBE6DF;color:var(--alert)} .scard .tag.meh{background:#FBF0D8;color:#8A6417}
.scard dl{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin:12px 0 0;font-size:12.5px}
.scard dt{color:var(--dim)} .scard dd{margin:0;font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:right}
.scard dd.hit{color:var(--ok)} .scard dd.miss{color:var(--alert)}
.scard p{font-size:12px;color:var(--dim);margin:10px 0 0}
.lever{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--card);
  border:1px solid var(--rule);border-radius:3px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.lever input{width:17px;height:17px;accent-color:var(--brand);margin-top:2px}
.lever b{font-size:13px} .lever p{margin:3px 0 0;font-size:12px;color:var(--dim)}
.lever .imp{font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-align:right;white-space:nowrap}
.wf{display:flex;flex-direction:column;gap:6px}
.wrow{display:grid;grid-template-columns:250px 1fr 110px 80px;gap:12px;align-items:center;font-size:12.5px}
.wtrack{height:20px;background:var(--brand-wash);border-radius:2px;position:relative;overflow:hidden}
.wfill{position:absolute;top:0;bottom:0;background:var(--brand-mid);transition:all .4s ease}
.wfill.gain{background:var(--ok)}
.wval{font-family:'IBM Plex Mono',monospace;text-align:right;font-weight:600}
.chip{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 9px;border-radius:10px;margin-top:7px}
.chip.ok{background:rgba(227,240,232,.95);color:var(--ok)} .chip.bad{background:rgba(251,230,223,.95);color:var(--alert)}
.chip.meh{background:rgba(251,240,216,.95);color:#8A6417}
.field.light label{opacity:1;color:var(--dim)}
.field.light input{background:var(--input);border:1px solid var(--input-line);color:var(--ink);width:110px}
@media (max-width:640px){.wrow{grid-template-columns:120px 1fr 80px 56px}}
</style>
</head>
<body>
<header class="mast">
  <div class="lockup">
    <img id="wordmark" alt="Awon">
    <div class="divider"></div>
    <div class="sub"><b>New &amp; Returning Forecast</b><span id="mastMonth">October 2026</span> · Awon KSA collections</div>
  </div>
  <div class="mhright">
    <div id="toast"></div>
    <div class="field">
      <label>Forecast month</label>
      <input id="monthLabel" value="October 2026">
    </div>
    <button class="btn ghost" id="augBtn">August run-rate</button>
    <button class="btn ghost" id="optBtn">Optimise to target</button>
    <button class="btn" id="exportBtn">Download Excel</button>
  </div>
</header>

<section class="readout">
  <div class="rblock">
    <div class="eyebrow" style="color:rgba(255,255,255,.6)">Kilos this plan collects</div>
    <div class="kg" id="rKg">—<small>KG</small></div>
    <div class="rnote" id="rKgNote"></div>
  </div>
  <div class="rblock">
    <div class="eyebrow" style="color:rgba(255,255,255,.6)">Cost per kg</div>
    <div class="kg" id="rCpk">—</div>
    <div id="rCpkChip"></div>
  </div>
  <div class="rblock">
    <div class="eyebrow" style="color:rgba(255,255,255,.6)">New donors</div>
    <div class="kg" id="rNew">—</div>
    <div id="rNewChip"></div>
  </div>
  <div class="rblock">
    <div class="eyebrow" style="color:rgba(255,255,255,.6)">Returning donors</div>
    <div class="kg" id="rRet">—</div>
    <div class="rnote" id="rRetNote"></div>
  </div>
  <div class="rblock">
    <div class="eyebrow" style="color:rgba(255,255,255,.6)">Drivers needed</div>
    <div class="kg" id="rDrv">—</div>
    <div id="rDrvChip"></div>
  </div>
</section>

<div class="kpis" id="kpis"></div>

<nav class="tabs">
  <button class="tab on" data-tab="plan">October plan</button>
  <button class="tab" data-tab="new">New donors</button>
  <button class="tab" data-tab="ret">Returning donors</button>
  <button class="tab" data-tab="city">City forecast</button>
  <button class="tab" data-tab="overhead">Overhead</button>
  <button class="tab" data-tab="base">August baseline</button>
</nav>

<div class="panel on" id="panel-plan"></div>
<div class="panel" id="panel-new"></div>
<div class="panel" id="panel-ret"></div>
<div class="panel" id="panel-city"></div>
<div class="panel" id="panel-overhead"></div>
<div class="panel" id="panel-base"></div>

const div = (a,b) => (b ? a/b : 0);

function effCPND(ch, st){
  let c = ch.cpnd;
  if(ch.id==="snap" && st.levers.snapRefresh) c = Math.min(c, 28);
  if(st.levers.exclude && ch.id!=="partner") c *= 0.85;
  const scale = ch.spend > 0 ? Math.pow(ch.spend / ch.ref, st.elasticity) : 1;
  return c * scale;
}
function channelDonors(ch, st){
  if(ch.kind==="fixed") return ch.donors;
  return ch.spend > 0 ? ch.spend / effCPND(ch, st) : 0;
}

function kgPair(city, st){
  const denom = st.baseNewShare*st.kgRatio + (1-st.baseNewShare);
  const kgRet = city.kgBlend / denom;
  return { kgNew: kgRet*st.kgRatio, kgRet };
}

// Returning donors per city from pools; optional cap = fraction of full returning volume
function returningFor(city, st, pools, capR){
  const p = PRESETS[st.preset];
  const seg = {};
  SEGMENTS.forEach(s=>{
    const pool = pools[s.key] * city.baseShare * st.served;
    const donors = pool * p.rate[s.key] * city.repeatIdx;
    seg[s.key] = { pool, rate:p.rate[s.key], donors, rcac:p.rcac[s.key], spend: donors * p.rcac[s.key] };
  });
  return seg;
}

function computePlan(cities, channels, st, pools, overheadAwon, returnScale){
  const rs = returnScale === undefined ? 1 : returnScale;
  const chRows = channels.map(ch=>{
    const donors = channelDonors(ch, st);
    return { ...ch, donors, cpndEff: ch.kind==="fixed" ? div(ch.spend, ch.donors) : effCPND(ch, st) };
  });
  // lever volumes on top of fixed channels
  const fastDonors = st.levers.fast ? 450 : 0;
  const capiDonors = st.levers.capi ? 300 : 0, capiSpend = st.levers.capi ? 900 : 0;

  const paidRows = chRows.filter(c=>c.kind==="scalable" && c.id!=="partner");
  const paidSpend = paidRows.reduce((a,c)=>a+c.spend,0);
  const paidNew = paidRows.reduce((a,c)=>a+c.donors,0);
  const partner = chRows.find(c=>c.id==="partner");
  const partnerSpend = partner ? partner.spend : 0, partnerNew = partner ? partner.donors : 0;
  const fixedRows = chRows.filter(c=>c.kind==="fixed");
  const otherSpend = fixedRows.reduce((a,c)=>a+c.spend,0) + capiSpend;
  const haloNew = st.halo ? Math.max(-fixedRows.reduce((a,c)=>a+c.donors,0), st.halo * (paidSpend - st.augPaidSpend) / 1000) : 0;
  const otherNew = fixedRows.reduce((a,c)=>a+c.donors,0) + fastDonors + capiDonors + haloNew;

  const totalDrivers = cities.reduce((a,c)=>a+c.drivers,0);
  const rows = cities.map(c=>{
    const { kgNew, kgRet } = kgPair(c, st);
    const seg = returningFor(c, st, pools);
    // optional scaling of returning volume, dropping the costliest segments first
    let segRows = SEGMENTS.map(s=>({ key:s.key, ...seg[s.key] }));
    if(rs < 1){
      const full = segRows.reduce((a,x)=>a+x.donors,0);
      let budget = full * rs;
      segRows = [...segRows].sort((a,b)=>a.rcac-b.rcac).map(x=>{
        const take = Math.max(0, Math.min(x.donors, budget)); budget -= take;
        return { ...x, donors: take, spend: take * x.rcac };
      });
    }
    const retDonors = segRows.reduce((a,x)=>a+x.donors,0);
    const waSpend = segRows.reduce((a,x)=>a+x.spend,0);
    const cPaidSpend = paidSpend * c.paidShare, cPaidNew = paidNew * c.paidShare;
    const cPartnerSpend = partnerSpend * c.baseShare, cPartnerNew = partnerNew * c.baseShare;
    const cOtherSpend = otherSpend * c.baseShare, cOtherNew = otherNew * c.baseShare;
    const newDonors = cPaidNew + cPartnerNew + cOtherNew;
    const newSpend = cPaidSpend + cPartnerSpend + cOtherSpend;
    const pickups = newDonors + retDonors;
    const kgNewTot = newDonors * kgNew, kgRetTot = retDonors * kgRet;
    const weight = kgNewTot + kgRetTot;
    const ohShare = overheadAwon * div(c.drivers, totalDrivers);
    const direct = newSpend + waSpend;
    const spend = direct + ohShare;
    return { ...c, kgNew, kgRet, segRows, retDonors, waSpend,
      paidSpend:cPaidSpend, paidNew:cPaidNew, partnerSpend:cPartnerSpend, partnerNew:cPartnerNew,
      otherSpend:cOtherSpend, otherNew:cOtherNew, newDonors, newSpend,
      pickups, kgNewTot, kgRetTot, weight, direct, ohShare, spend,
      newShare: div(newDonors, pickups), nCAC: div(newSpend, newDonors), rCAC: div(waSpend, retDonors),
      cpk: div(spend, weight), dailyWeight: div(weight, c.days),
      ppd: div(div(pickups, c.days), c.drivers),
      driversNeeded: Math.max(Math.ceil(div(pickups, c.days * st.maxPPD) - 1e-9), Math.ceil(div(weight, c.days * c.carCap) - 1e-9)),
      carUse: div(div(div(weight, c.days), c.drivers), c.carCap),
      leads: div(pickups, c.pr) };
  });
  const s = k => rows.reduce((a,r)=>a+(r[k]||0),0);
  const T = { rows, chRows, fastDonors, capiDonors, capiSpend, haloNew,
    paidSpend, paidNew, partnerSpend, partnerNew, otherSpend, otherNew,
    newDonors:s("newDonors"), retDonors:s("retDonors"), pickups:s("pickups"),
    newSpend:s("newSpend"), waSpend:s("waSpend"), direct:s("direct"), overhead:overheadAwon,
    spend:s("spend"), weight:s("weight"), kgNewTot:s("kgNewTot"), kgRetTot:s("kgRetTot"),
    drivers:s("drivers"), driversNeeded:s("driversNeeded"), leads:s("leads") };
  T.cpk = div(T.spend, T.weight);
  T.newShare = div(T.newDonors, T.pickups);
  T.nCAC = div(T.newSpend, T.newDonors);
  T.rCAC = div(T.waSpend, T.retDonors);
  T.kgNewAvg = div(T.kgNewTot, T.newDonors);
  T.kgRetAvg = div(T.kgRetTot, T.retDonors);
  T.newKgShare = div(T.kgNewTot, T.weight);
  T.cpkNew = div(T.newSpend, T.kgNewTot);
  T.cpkRet = div(T.waSpend, T.kgRetTot);
  return T;
}

// Merit-order optimiser: buy new donors from the cheapest marginal channel until
// the stopping rule fires. Returns channel spends.
function meritOrder(cities, channels, st, pools, oh, stopFn, step){
  step = step || 250;
  const ch = channels.map(c=>({ ...c, spend: c.kind==="scalable" ? 0 : c.spend }));
  let plan = computePlan(cities, ch, st, pools, oh);
  for(let guard=0; guard<2000; guard++){
    if(stopFn(plan)) break;
    let best=null, bestCost=Infinity;
    ch.forEach((c,i)=>{
      if(c.kind!=="scalable" || c.spend + step > c.cap) return;
      const before = channelDonors(c, st);
      const trial = { ...c, spend: c.spend + step };
      const after = channelDonors(trial, st);
      const marg = div(step, after - before);
      if(marg < bestCost){ bestCost = marg; best = i; }
    });
    if(best===null) break;
    const saved = ch[best].spend;
    ch[best].spend += step;
    const next = computePlan(cities, ch, st, pools, oh);
    if(next.__overshoot){ ch[best].spend = saved; break; }
    plan = next;
  }
  return { channels: ch, plan };
}

// Scenario A: most kilos at or under the CPK target (returning at the chosen preset)
function solveMaxKgAtCPK(cities, channels, st, pools, oh){
  const ch = channels.map(c=>({ ...c, spend: c.kind==="scalable" ? 0 : c.spend }));
  let plan = computePlan(cities, ch, st, pools, oh);
  if(plan.cpk > st.targetCPK) return { channels: ch, plan, infeasible:true };
  const step = 250;
  for(let guard=0; guard<2000; guard++){
    let best=null, bestCost=Infinity;
    ch.forEach((c,i)=>{
      if(c.kind!=="scalable" || c.spend + step > c.cap) return;
      const d = channelDonors({ ...c, spend:c.spend+step }, st) - channelDonors(c, st);
      const m = div(step, d);
      if(m < bestCost){ bestCost=m; best=i; }
    });
    if(best===null) break;
    ch[best].spend += step;
    const next = computePlan(cities, ch, st, pools, oh);
    if(next.cpk > st.targetCPK){ ch[best].spend -= step; break; }
    plan = next;
  }
  return { channels: ch, plan };
}

// Scenario C: push new donors until the share target is met, whatever it costs
function solveShareAtMaxReturning(cities, channels, st, pools, oh){
  const ch = channels.map(c=>({ ...c, spend: c.kind==="scalable" ? 0 : c.spend }));
  let plan = computePlan(cities, ch, st, pools, oh);
  const step = 500;
  for(let guard=0; guard<3000 && plan.newShare < st.targetNewShare; guard++){
    let best=null, bestCost=Infinity;
    ch.forEach((c,i)=>{
      if(c.kind!=="scalable" || c.spend + step > c.cap) return;
      const d = channelDonors({ ...c, spend:c.spend+step }, st) - channelDonors(c, st);
      const m = div(step, d);
      if(m < bestCost){ bestCost=m; best=i; }
    });
    if(best===null) return { channels: ch, plan, capped:true };
    ch[best].spend += step;
    plan = computePlan(cities, ch, st, pools, oh);
  }
  return { channels: ch, plan, capped: plan.newShare < st.targetNewShare };
}

// Scenario B: most kilos meeting BOTH ratio targets, allowed to shrink returning
function solveBothRatios(cities, channels, st, pools, oh){
  let best = null;
  for(let i=100; i>=2; i-=2){
    const rs = i/100;
    const ch = channels.map(c=>({ ...c, spend: c.kind==="scalable" ? 0 : c.spend }));
    let plan = computePlan(cities, ch, st, pools, oh, rs);
    const step = 500;
    for(let guard=0; guard<1500 && plan.newShare < st.targetNewShare; guard++){
      let b=null, bc=Infinity;
      ch.forEach((c,j)=>{
        if(c.kind!=="scalable" || c.spend + step > c.cap) return;
        const d = channelDonors({ ...c, spend:c.spend+step }, st) - channelDonors(c, st);
        const m = div(step, d);
        if(m < bc){ bc=m; b=j; }
      });
      if(b===null) break;
      ch[b].spend += step;
      plan = computePlan(cities, ch, st, pools, oh, rs);
    }
    if(plan.newShare >= st.targetNewShare - 1e-6 && plan.cpk <= st.targetCPK + 1e-6){
      if(!best || plan.weight > best.plan.weight) best = { channels: ch, plan, returnScale: rs };
    }
  }
  return best;
}

// nCAC that would let both ratio targets hold at the chosen returning volume
function requiredNCAC(plan, st){
  const R = plan.retDonors, N = R * st.targetNewShare / (1 - st.targetNewShare);
  const kg = plan.kgRetTot + N * plan.kgNewAvg;
  return { N, ncac: div(st.targetCPK * kg - plan.waSpend - plan.overhead, N) };
}

const clone = x => JSON.parse(JSON.stringify(x));
PRESETS.custom = clone(PRESETS.max); PRESETS.custom.label = "Custom";
let cities = clone(CITY_BASE);
let channels = clone(CHANNELS_BASE);
let st = clone(SETTINGS_BASE);
let pools = clone(POOLS_BASE);
let overhead = clone(OVERHEAD_BASE);
let P, SC = null, scTimer = null;

const ohAwon = () => overhead.reduce((a,r)=>a+r.total*r.awonPct, 0);
const ohSutra = () => overhead.reduce((a,r)=>a+r.total*(1-r.awonPct), 0);

const AUG_ACTUAL = { newDonors:5900, retDonors:13000, kgMTD:293696, daysMTD:19, daysOp:27,
                     spendMTD:68447, spendDays:23, calDays:31 };
AUG_ACTUAL.kgFull = AUG_ACTUAL.kgMTD * AUG_ACTUAL.daysOp / AUG_ACTUAL.daysMTD;
AUG_ACTUAL.spendFull = AUG_ACTUAL.spendMTD * AUG_ACTUAL.calDays / AUG_ACTUAL.spendDays;

function augSettings(){
  const s = clone(st); s.preset = "baseline";
  s.levers = { exclude:false, snapRefresh:false, fast:false, capi:false }; return s;
}
function augPlan(){ return computePlan(cities, CHANNELS_BASE, augSettings(), pools, ohAwon()); }

function compute(){ P = computePlan(cities, channels, st, pools, ohAwon()); }

function computeScenarios(){
  const oh = ohAwon();
  const aug = augPlan();
  const A = solveMaxKgAtCPK(cities, channels, st, pools, oh);
  const B = solveBothRatios(cities, channels, st, pools, oh);
  const C = solveShareAtMaxReturning(cities, channels, st, pools, oh);
  const req = requiredNCAC(A.plan, st);
  // waterfall: August → each lever → budget reallocation
  const steps = [];
  let s = augSettings();
  const push = (label, plan) => steps.push({ label, plan });
  push("August run-rate", computePlan(cities, CHANNELS_BASE, s, pools, oh));
  s = clone(s); s.preset = st.preset; push(`Reactivation: ${PRESETS[st.preset].label.toLowerCase()}`, computePlan(cities, CHANNELS_BASE, s, pools, oh));
  const order = [["exclude","Exclude existing donors from paid"],["snapRefresh","Refresh Snapchat creative"],
                 ["fast","48-hour first pickup"],["capi","Click-to-WhatsApp + CAPI"]];
  order.forEach(([k,l])=>{ if(st.levers[k]){ s = clone(s); s.levers[k] = true; push(l, computePlan(cities, CHANNELS_BASE, s, pools, oh)); }});
  push("Reallocate budget to target", A.plan);
  SC = { aug, A, B, C, req, steps };
}
function scheduleScenarios(){
  clearTimeout(scTimer);
  scTimer = setTimeout(()=>{ computeScenarios(); renderPlan(); }, 280);
}

// ---- events ----
function rerenderKeeping(t, selector){
  const raw = t.value; let pos = null;
  try { pos = t.selectionStart; } catch(_){}
  render();
  const again = document.querySelector(selector);
  if(again){ again.value = raw; again.focus(); if(pos!==null){ try{ again.setSelectionRange(pos,pos); }catch(_){} } }
}
const num = v => v === "" ? 0 : Number(v);

document.addEventListener("input", e=>{
  const t = e.target, d = t.dataset;
  if(d.ch){
    const c = channels.find(x=>x.id===d.ch); if(!c) return;
    c[d.key] = num(t.value); rerenderKeeping(t, `[data-ch="${d.ch}"][data-key="${d.key}"]`);
  } else if(d.city){
    const c = cities.find(x=>x.id===Number(d.city)); if(!c) return;
    c[d.key] = num(t.value); rerenderKeeping(t, `[data-city="${d.city}"][data-key="${d.key}"]`);
  } else if(d.pool){
    pools[d.pool] = num(t.value); rerenderKeeping(t, `[data-pool="${d.pool}"]`);
  } else if(d.rate || d.rcac){
    if(st.preset !== "custom"){ PRESETS.custom = clone(PRESETS[st.preset]); PRESETS.custom.label = "Custom"; st.preset = "custom"; }
    if(d.rate) PRESETS.custom.rate[d.rate] = num(t.value); else PRESETS.custom.rcac[d.rcac] = num(t.value);
    rerenderKeeping(t, d.rate ? `[data-rate="${d.rate}"]` : `[data-rcac="${d.rcac}"]`);
  } else if(d.set){
    st[d.set] = num(t.value); rerenderKeeping(t, `[data-set="${d.set}"]`);
  } else if(d.oh && t.tagName!=="SELECT"){
    const r = overhead.find(x=>x.id===Number(d.oh)); if(!r) return;
    r[d.key] = d.key==="item" ? t.value : num(t.value);
    rerenderKeeping(t, `[data-oh="${d.oh}"][data-key="${d.key}"]`);
  } else if(t.id==="tCPK"){ st.targetCPK = num(t.value); rerenderKeeping(t, "#tCPK"); }
  else if(t.id==="tShare"){ st.targetNewShare = num(t.value); rerenderKeeping(t, "#tShare"); }
  else if(t.id==="tDays"){ st.daysInMonth = num(t.value); rerenderKeeping(t, "#tDays"); }
  else if(t.id==="monthLabel"){ st.monthLabel = t.value; document.getElementById("mastMonth").textContent = t.value; }
});

document.addEventListener("change", e=>{
  const t = e.target, d = t.dataset;
  if(d.lever){ st.levers[d.lever] = t.checked; render(); }
  if(d.oh && t.tagName==="SELECT"){ const r = overhead.find(x=>x.id===Number(d.oh)); if(r){ r.type = t.value; render(); } }
});

function applyA(){
  const A = solveMaxKgAtCPK(cities, channels, st, pools, ohAwon());
  A.channels.forEach(c=>{ const x = channels.find(y=>y.id===c.id); if(x) x.spend = c.spend; });
  render();
  toast(`Optimised: ${n0(A.plan.newDonors)} new, ${n0(A.plan.retDonors)} returning, ${n0(A.plan.weight)} kg at ${m3(A.plan.cpk)}/kg.`);
}

document.addEventListener("click", e=>{
  const t = e.target, d = t.dataset;
  if(d.preset){ st.preset = d.preset; render(); }
  if(t.id==="applyA" || t.id==="optBtn") applyA();
  if(t.id==="augBtn"){
    channels = clone(CHANNELS_BASE); st.preset = "baseline";
    st.levers = { exclude:false, snapRefresh:false, fast:false, capi:false };
    render(); toast("Reset to August's spends and reactivation rate.");
  }
  if(t.id==="addOh"){ overhead.push({id:Date.now(), type:"Other", item:"New cost line", total:0, awonPct:0.85}); render(); }
  if(d.ohrm){ overhead = overhead.filter(r=>r.id!==Number(d.ohrm)); render(); }
  if(t.classList.contains("tab")){
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on")); t.classList.add("on");
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("on"));
    document.getElementById("panel-"+d.tab).classList.add("on");
  }
  if(t.id==="exportBtn") exportExcel();
});

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  setTimeout(()=>{ el.style.display = "none"; }, 6000);
}

const BRAND = "FF1D4A4F", BRAND_DEEP = "FF123236", BRAND_TINT = "FFDCE8E7", BRAND_WASH = "FFEFF5F4",
      SUTRA_C = "FFA2643A", SUTRA_TINT = "FFF1E6DA", INPUT_FILL = "FFFFF6E3", RULE = "FFD5D8D2",
      WHITE = "FFFFFFFF", INK = "FF16211F", DIM = "FF63706E";

const FONT = "Arial";
const fill = c => ({ type:"pattern", pattern:"solid", fgColor:{argb:c} });
const thin = { style:"thin", color:{argb:RULE} };
const box = { top:thin, left:thin, bottom:thin, right:thin };

const NF = { money:'$#,##0;($#,##0);"–"', money2:'$#,##0.00;($#,##0.00);"–"',
             money3:'$#,##0.000;($#,##0.000);"–"', num:'#,##0;(#,##0);"–"',
             num1:'#,##0.0;(#,##0.0);"–"', pct:'0.0%' };

function styleTitle(ws, range, text, sub, colour){
  ws.mergeCells(range);
  const c = ws.getCell(range.split(":")[0]);
  c.value = text;
  c.font = { name:FONT, size:16, bold:true, color:{argb:WHITE} };
  c.fill = fill(colour || BRAND);
  c.alignment = { vertical:"middle", horizontal:"left", indent:1 };
  ws.getRow(c.row).height = 30;
  if(sub){
    const r2 = c.row + 1;
    const end = range.split(":")[1].replace(/\d+/, r2);
    ws.mergeCells(`A${r2}:${end}`);
    const s = ws.getCell(`A${r2}`);
    s.value = sub;
    s.font = { name:FONT, size:9, italic:true, color:{argb:DIM} };
    s.alignment = { vertical:"middle", horizontal:"left", indent:1 };
    ws.getRow(r2).height = 18;
  }
}

function bandRow(ws, row, spans, colour){
  spans.forEach(([from,to,label])=>{
    ws.mergeCells(`${from}${row}:${to}${row}`);
    const c = ws.getCell(`${from}${row}`);
    c.value = label;
    c.font = { name:FONT, size:9, bold:true, color:{argb:colour} };
    c.fill = fill(BRAND_TINT);
    c.alignment = { horizontal:"center", vertical:"middle" };
    c.border = box;
  });
  ws.getRow(row).height = 18;
}

function headerRow(ws, row, map, colour){
  Object.entries(map).forEach(([col,label])=>{
    const c = ws.getCell(col+row);
    c.value = label;
    c.font = { name:FONT, size:9, bold:true, color:{argb:WHITE} };
    c.fill = fill(colour);
    c.alignment = { horizontal:"center", vertical:"bottom", wrapText:true };
    c.border = box;
  });
  ws.getRow(row).height = 42;
}

function put(ws, addr, value, opts){
  const c = ws.getCell(addr);
  c.value = value;
  const o = opts || {};
  c.font = { name:FONT, size:10, bold:!!o.bold, color:{argb:o.colour || INK} };
  if(o.numFmt) c.numFmt = o.numFmt;
  if(o.fill) c.fill = fill(o.fill);
  c.border = box;
  c.alignment = { horizontal: o.align || (typeof value === "object" || typeof value === "number" ? "right" : "left"),
                  vertical:"middle", indent: o.align === "left" || typeof value === "string" ? 1 : 0 };
  return c;
}
const F = (formula, result) => ({ formula, result: isFinite(result) ? result : 0 });

function sectionHead(ws, row, from, to, text, colour){
  ws.mergeCells(`${from}${row}:${to}${row}`);
  const c = ws.getCell(`${from}${row}`);
  c.value = text;
  c.font = { name:FONT, size:11, bold:true, color:{argb:WHITE} };
  c.fill = fill(colour || BRAND_DEEP);
  c.alignment = { vertical:"middle", horizontal:"left", indent:1 };
  ws.getRow(row).height = 22;
}

    const rg = col => `${col}${H0}:${col}${LAST}`;
    const TD = (addr, val, fmt) => put(ws, addr, val, { numFmt:fmt, bold:true, colour:WHITE, fill:BRAND_DEEP });
    put(ws, "A"+TOT, "TOTAL", { bold:true, colour:WHITE, fill:BRAND_DEEP, align:"left" });
    put(ws, "B"+TOT, "/ blended", { bold:true, colour:WHITE, fill:BRAND_DEEP, align:"left" });
    [["C",P.direct,NF.money],["D",P.pickups,NF.num],["E",P.newDonors,NF.num],["F",P.retDonors,NF.num],
     ["H",P.paidSpend,NF.money],["I",P.paidNew,NF.num],["J",P.partnerSpend,NF.money],["K",P.partnerNew,NF.num],
     ["L",P.otherSpend,NF.money],["M",P.otherNew,NF.num],["N",P.newSpend,NF.money],["P",P.waSpend,NF.money],
     ["S",P.drivers,NF.num],["U",P.pickups,NF.num],["Y",P.kgNewTot,NF.num],["Z",P.kgRetTot,NF.num],
     ["AA",P.weight,NF.num],["AB",P.rows.reduce((a,c)=>a+c.dailyWeight,0),NF.num],["AE",P.driversNeeded,NF.num],["AF",P.leads,NF.num],
     ["AJ",P.rows.reduce((a,c)=>a+c.paidShare,0),NF.pct],["AK",P.rows.reduce((a,c)=>a+c.baseShare,0),NF.pct]]
      .forEach(([c,v,f])=>TD(c+TOT, F(`SUM(${rg(c)})`, v), f));
    TD("G"+TOT, F(`IFERROR(E${TOT}/D${TOT},0)`, P.newShare), NF.pct);
    TD("O"+TOT, F(`IFERROR(N${TOT}/E${TOT},0)`, P.nCAC), NF.money2);
    TD("Q"+TOT, F(`IFERROR(P${TOT}/F${TOT},0)`, P.rCAC), NF.money2);
    const avgDays = P.rows.reduce((a,c)=>a+c.days,0)/n;
    TD("T"+TOT, F(`AVERAGE(${rg("T")})`, avgDays), NF.num1);
    TD("V"+TOT, F(`IFERROR(U${TOT}/T${TOT}/S${TOT},0)`, div(div(P.pickups,avgDays),P.drivers)), NF.num1);
    TD("W"+TOT, F(`IFERROR(Y${TOT}/E${TOT},0)`, P.kgNewAvg), NF.num1);
    TD("X"+TOT, F(`IFERROR(Z${TOT}/F${TOT},0)`, P.kgRetAvg), NF.num1);
    TD("AC"+TOT, F(`AVERAGE(${rg("AC")})`, P.rows.reduce((a,c)=>a+c.carCap,0)/n), NF.num);
    TD("AD"+TOT, "", NF.pct);
    TD("AG"+TOT, F(`IFERROR(C${TOT}/AA${TOT},0)`, div(P.direct,P.weight)), NF.money3);
    TD("AH"+TOT, F(`IFERROR(C${TOT}/D${TOT},0)`, div(P.direct,P.pickups)), NF.money2);
    ["AL","AM"].forEach(c=>TD(c+TOT, "", NF.num));
    ws.getRow(TOT).height = 20;
    ws.pageSetup = { orientation:"landscape", paperSize:9, fitToPage:true, fitToWidth:1, fitToHeight:0,
                     margins:{ left:0.3, right:0.3, top:0.4, bottom:0.4, header:0.2, footer:0.2 } };

    // Now that the total row is known, point channel kg at the forecast's average new kg/pickup
    nc.eachRow(row=>row.eachCell(cell=>{
      if(cell.value && typeof cell.value==="object" && cell.value.formula && cell.value.formula.includes("__KGNEW__"))
        cell.value = { formula: cell.value.formula.replace(/__KGNEW__/g, `'${mainName}'!$W$${TOT}`), result: cell.value.result };
    }));

    // Executive summary
    let E0 = TOT + 3;
    sectionHead(ws, E0, "A", "G", "EXECUTIVE SUMMARY — AGAINST TARGET");
    const exec = [
      ["Target cost per kg", A_(AR.cpk), st.targetCPK, NF.money3],
      ["Forecast cost per kg (all-in)", `IFERROR((C${TOT}+${OH})/AA${TOT},0)`, P.cpk, NF.money3, "cpk"],
      ["Target new-donor share", A_(AR.share), st.targetNewShare, NF.pct],
      ["Forecast new-donor share", `G${TOT}`, P.newShare, NF.pct, "share"],
      ["New donors", `E${TOT}`, P.newDonors, NF.num],
      ["Returning donors", `F${TOT}`, P.retDonors, NF.num],
      ["Total pickups", `U${TOT}`, P.pickups, NF.num],
      ["Target weight (kg)", `AA${TOT}`, P.weight, NF.num],
      ["— from new donors", `Y${TOT}`, P.kgNewTot, NF.num],
      ["— from returning donors", `Z${TOT}`, P.kgRetTot, NF.num],
      ["Direct marketing budget", `C${TOT}`, P.direct, NF.money],
      ["— new-donor budget", `N${TOT}`, P.newSpend, NF.money],
      ["— WhatsApp reactivation", `P${TOT}`, P.waSpend, NF.money],
      ["Marketing overhead (Awon share)", OH, P.overhead, NF.money],
      ["Total spending", `C${TOT}+${OH}`, P.spend, NF.money],
      ["nCAC — (paid + organic) ÷ new donors", `O${TOT}`, P.nCAC, NF.money2],
      ["rCAC — WhatsApp spend ÷ returning donors", `Q${TOT}`, P.rCAC, NF.money2],
      ["Cost per first-pickup kg", `IFERROR(N${TOT}/Y${TOT},0)`, P.cpkNew, NF.money3],
      ["Cost per returning kg", `IFERROR(P${TOT}/Z${TOT},0)`, P.cpkRet, NF.money3],
      ["Drivers on roster", `S${TOT}`, P.drivers, NF.num],
      ["Drivers needed", `AE${TOT}`, P.driversNeeded, NF.num, "drv"]
    ];
    exec.forEach(([l,f,v,fmt,flag],i)=>{ const R = E0+1+i, wash = i%2 ? BRAND_WASH : null;
      ws.mergeCells(`A${R}:D${R}`);
      put(ws, "A"+R, l, { align:"left", fill:wash, bold: !l.startsWith("—") });
      let colour = INK;
      if(flag==="cpk") colour = v <= st.targetCPK+1e-6 ? GREEN_OK : RED_BAD;
      if(flag==="share") colour = v >= st.targetNewShare-1e-6 ? GREEN_OK : RED_BAD;
      if(flag==="drv") colour = v <= P.drivers ? GREEN_OK : RED_BAD;
      put(ws, "E"+R, F(f, v), { numFmt:fmt, bold:true, colour, fill:wash });
      if(flag){ ws.mergeCells(`F${R}:G${R}`); }
      if(flag==="cpk") put(ws, "F"+R, F(`IF(E${R}<=E${R-1},"On target","Above target")`, v<=st.targetCPK+1e-6?"On target":"Above target"), { align:"left", bold:true, colour, fill:wash });
      if(flag==="share") put(ws, "F"+R, F(`IF(E${R}>=E${R-1},"On target","Below target")`, v>=st.targetNewShare-1e-6?"On target":"Below target"), { align:"left", bold:true, colour, fill:wash });
      if(flag==="drv") put(ws, "F"+R, F(`IF(E${R}<=E${R-1},"Covered","Short "&(E${R}-E${R-1}))`, v<=P.drivers?"Covered":"Short "+(v-P.drivers)), { align:"left", bold:true, colour, fill:wash });
    });

    // City spend with overhead on driver share
    let C0 = E0 + exec.length + 3;
    sectionHead(ws, C0, "A", "J", "CITY SPEND — DIRECT BUDGET PLUS OVERHEAD ON DRIVER SHARE");
    headerRow(ws, C0+1, { A:"City", B:"Drivers", C:"Driver share", D:"Direct budget", E:"Overhead carried", F:"City spend",
      G:"Kilos", H:"CPK (all-in)", I:"New share", J:"vs target CPK" }, BRAND);
    P.rows.forEach((c,i)=>{ const R = C0+2+i, src = H0+i, wash = i%2 ? BRAND_WASH : null;
      put(ws, "A"+R, c.city, { align:"left", bold:true, fill:wash });
      put(ws, "B"+R, F(`S${src}`, c.drivers), { numFmt:NF.num, fill:wash });
      put(ws, "C"+R, F(`IFERROR(B${R}/$S$${TOT},0)`, div(c.drivers,P.drivers)), { numFmt:NF.pct, fill:wash });
      put(ws, "D"+R, F(`C${src}`, c.direct), { numFmt:NF.money, fill:wash });
      put(ws, "E"+R, F(`${OH}*C${R}`, c.ohShare), { numFmt:NF.money, fill:wash });
      put(ws, "F"+R, F(`D${R}+E${R}`, c.spend), { numFmt:NF.money, bold:true, fill:wash });
      put(ws, "G"+R, F(`AA${src}`, c.weight), { numFmt:NF.num, fill:wash });
      const ok = c.cpk <= st.targetCPK+1e-6;
      put(ws, "H"+R, F(`IFERROR(F${R}/G${R},0)`, c.cpk), { numFmt:NF.money3, bold:true, colour: ok?GREEN_OK:RED_BAD, fill:wash });
      put(ws, "I"+R, F(`G${src}`, c.newShare), { numFmt:NF.pct, fill:wash });
      put(ws, "J"+R, F(`H${R}-${A_(AR.cpk)}`, c.cpk-st.targetCPK), { numFmt:'+$0.000;-$0.000;"–"', colour: ok?GREEN_OK:RED_BAD, fill:wash });
    });
    const CT = C0+2+n, dk = { bold:true, colour:WHITE, fill:BRAND_DEEP };
    put(ws, "A"+CT, "TOTAL", { ...dk, align:"left" });
    put(ws, "B"+CT, F(`SUM(B${C0+2}:B${CT-1})`, P.drivers), { ...dk, numFmt:NF.num });
    put(ws, "C"+CT, F(`SUM(C${C0+2}:C${CT-1})`, 1), { ...dk, numFmt:NF.pct });
    put(ws, "D"+CT, F(`SUM(D${C0+2}:D${CT-1})`, P.direct), { ...dk, numFmt:NF.money });
    put(ws, "E"+CT, F(`SUM(E${C0+2}:E${CT-1})`, P.overhead), { ...dk, numFmt:NF.money });
    put(ws, "F"+CT, F(`SUM(F${C0+2}:F${CT-1})`, P.spend), { ...dk, numFmt:NF.money });
    put(ws, "G"+CT, F(`SUM(G${C0+2}:G${CT-1})`, P.weight), { ...dk, numFmt:NF.num });
    put(ws, "H"+CT, F(`IFERROR(F${CT}/G${CT},0)`, P.cpk), { ...dk, numFmt:NF.money3 });
    put(ws, "I"+CT, F(`G${TOT}`, P.newShare), { ...dk, numFmt:NF.pct });
    put(ws, "J"+CT, F(`H${CT}-${A_(AR.cpk)}`, P.cpk-st.targetCPK), { ...dk, numFmt:'+$0.000;-$0.000;"–"' });

    /* ---------------- August Baseline ---------------- */
    const a = SC.aug;
    bl.columns = [{width:30},{width:15},{width:15},{width:12},{width:60}];
    styleTitle(bl, "A1:E1", "AUGUST 2026 — DOES THE MODEL REPRODUCE IT?", "August spends, no levers, calibrated reactivation rates — against what August actually did");
    headerRow(bl, 4, { A:"Measure", B:"Model", C:"Actual", D:"Gap", E:"Actual from" }, BRAND);
    [["New donors", a.newDonors, AUG_ACTUAL.newDonors, NF.num, "Cohort analysis, phone-matched across Odoo and legacy data"],
     ["Returning donors", a.retDonors, AUG_ACTUAL.retDonors, NF.num, "Cohort analysis"],
     ["New share", a.newShare, AUG_ACTUAL.newDonors/(AUG_ACTUAL.newDonors+AUG_ACTUAL.retDonors), NF.pct, "Cohort analysis"],
     ["Kilos", a.weight, AUG_ACTUAL.kgFull, NF.num, "MTD tab: 293,696 kg over 19 of 27 operating days, pro-rated"],
     ["Spend", a.spend, AUG_ACTUAL.spendFull, NF.money, "MTD tab: $68,447 over 23 of 31 days, pro-rated"],
     ["Cost per kg", a.cpk, AUG_ACTUAL.spendFull/AUG_ACTUAL.kgFull, NF.money3, "Derived"],
     ["nCAC", a.nCAC, null, NF.money2, "Paid-only cost per genuinely new donor was $28 in Aug–Sep"],
     ["rCAC", a.rCAC, null, NF.money2, "WhatsApp spend per returning donor"],
     ["Cost per first-pickup kg", a.cpkNew, null, NF.money3, "New-donor spend ÷ first-pickup kilos"],
     ["Cost per returning kg", a.cpkRet, null, NF.money3, "WhatsApp spend ÷ returning kilos"]]
      .forEach(([l,m,act,f,src],i)=>{ const R = 5+i, wash = i%2 ? BRAND_WASH : null;
        put(bl, "A"+R, l, { align:"left", bold:true, fill:wash });
        put(bl, "B"+R, m, { numFmt:f, fill:wash });
        put(bl, "C"+R, act===null ? "" : act, { numFmt:f, fill:wash });
        put(bl, "D"+R, act===null ? "" : F(`IFERROR(B${R}/C${R}-1,0)`, m/act-1), { numFmt:'+0.0%;-0.0%;"–"', fill:wash });
        put(bl, "E"+R, src, { align:"left", fill:wash });
      });

    /* ---------------- Read Me ---------------- */
    rm.columns = [{width:4},{width:120}];
    styleTitle(rm, "A1:B1", `MODEL NOTES — AWON ${ML.toUpperCase()} FORECAST, NEW & RETURNING DONORS`, `Generated ${stamp}`);
    const lines = [
      ["h","How to read this workbook"],
      ["p",`'${mainName}' keeps the old forecast's shape — one row per city, a total row, an executive summary and city spend with overhead — but splits every donor, kilo and dollar into new and returning.`],
      ["p","Shaded cells are inputs. Every other number is a live formula, so changing a channel's spend, a return rate or a city's driver count recalculates the whole month."],
      ["k","Shaded cells are inputs. White cells are formulas. Dark rows are totals. Green / red marks on-target / off-target."],
      ["h","Definitions (same as dashboard.awonksa.com)"],
      ["p","New donor: a phone number whose first-ever received donation falls in the month, matched across Odoo and the legacy customer data."],
      ["p","Returning donor: a phone number that donates in the month and has donated before."],
      ["p","nCAC = (paid + organic spend) ÷ new donors.   rCAC = WhatsApp spend ÷ returning donors."],
      ["h","How new donors are forecast"],
      ["p","Each channel converts spend into new donors at its own cost per genuinely new donor, measured Aug–Sep 2026: Google $18.50, Snapchat $34, Meta $215, TikTok $138."],
      ["p","Channels get dearer as spend rises: effective cost per new donor = base × lever factor × (spend ÷ August spend) ^ elasticity. This is why the optimiser stops adding to Google rather than moving everything there."],
      ["p","Paid new donors land in cities by the old forecast's paid-budget split. Partner, organic and WhatsApp-new donors land by each city's share of the donor base."],
      ["h","How returning donors are forecast"],
      ["p","From the donor base on 20 Sep 2026, by recency: active (≤90 days), due (91–180), lapsing (181–365), dormant (365+). Each segment returns at a monthly rate and costs an rCAC."],
      ["p","The August run-rate is calibrated to reproduce August: 13.0K returning on about $11.2K of WhatsApp. Always-on and maximum raise the return rate on due, lapsing and dormant donors. Active donors are left alone."],
      ["p","Each city's returning volume is its share of the base times a repeat index. Makkah repeats at half the rate of Riyadh and Jeddah over twelve months, so its index is 0.53."],
      ["h","Kilos"],
      ["p","Each city's measured kg per pickup (four-month median) is split into new and returning using the cohort ratio: first pickups run ~1.29× a returning pickup."],
      ["h","The October targets"],
      ["p",`Plan A hits ${m2(st.targetCPK)} per kg and collects the most kilos it can. It grows new donors ${pc0(div(A.plan.newDonors,aug.newDonors)-1)} on August but reaches a ${pc0(A.plan.newShare)} new share, because returning donors grow faster.`],
      ["p",`Hitting ${pc0(st.targetNewShare)} new and ${m2(st.targetCPK)} together requires either an nCAC of ${m2(req.ncac)} (August: ${m2(aug.nCAC)}), or switching off part of the reactivation program and collecting fewer kilos. See the Assumptions sheet.`],
      ["p","Recommendation: keep the cost-per-kg target, and set acquisition as a volume target (new donors) rather than a share."],
      ["h","Assumptions to watch"],
      ["p","Partner channel: co-branded partner acquisition at ALDERAYEA's historical ~$12 per new donor, capped at its historical ~1,500 a month. It is not running today."],
      ["p","Maximum reactivation: 19% of due and 7.5% of lapsing donors in one month. Only achieved in bursts so far."],
      ["p","Exclusion audiences: modelled as 15% cheaper new donors on every paid platform."],
      ["p","Fleet: drivers needed assumes at most the pickups-per-day setting and never more kilos than car capacity."],
      ["p","Sutra is excluded, as on the live dashboard."],
      ["p","Sources: cohort analysis (253,599 donors, phone-matched, Jan 2024–Sep 2026); Supermetrics platform spend; Awon MTD & Daily Reporting workbook; _Forecast_2024-2026.xlsx."]
    ];
    let rr = 4;
    lines.forEach(([kind,text])=>{
      if(kind==="h"){ rr++; sectionHead(rm, rr, "A", "B", text.toUpperCase()); }
      else if(kind==="k"){ rm.getCell("A"+rr).fill = fill(INPUT_FILL); rm.getCell("A"+rr).border = box;
        const c = rm.getCell("B"+rr); c.value = text; c.font = { name:FONT, size:10, italic:true, color:{argb:DIM} }; c.alignment = { indent:1 }; }
      else { const c = rm.getCell("B"+rr); c.value = text; c.font = { name:FONT, size:10, color:{argb:INK} }; c.alignment = { indent:1, wrapText:true, vertical:"top" };
        rm.getRow(rr).height = text.length > 130 ? 28 : 16; }
      rr++;
    });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `Awon_${ML.replace(/\s+/g,"_")}_Forecast_New_Returning.xlsx`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast("Downloaded " + link.download);
  } catch(err){
    console.error(err); toast("Export failed: " + err.message);
  }
}
// ==== EXPORT END ===========================================================

document.getElementById("wordmark").src = "data:image/png;base64," + WORDMARK;
// Open on the optimised October plan
(function init(){
  const A0 = solveMaxKgAtCPK(cities, channels, st, pools, ohAwon());
  A0.channels.forEach(c=>{ const x = channels.find(y=>y.id===c.id); if(x) x.spend = c.spend; });
  render();
})();
</script>
